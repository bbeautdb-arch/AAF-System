<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAF — %เกรดและปัญหาประจำวัน</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0f1828;
    color: #e5edf7;
  }
  .launch-card {
    width: min(520px, calc(100% - 40px));
    padding: 32px;
    border: 1px solid rgba(45, 212, 191, .28);
    border-radius: 20px;
    background: #1d2939;
    box-shadow: 0 24px 64px rgba(0, 0, 0, .28);
    text-align: center;
  }
  .launch-card span { display: block; font-size: 44px; margin-bottom: 12px; }
  .launch-card h1 { margin: 0 0 8px; font-size: 24px; }
  .launch-card p { margin: 0; color: #9ba8ba; line-height: 1.65; }
  .launch-card a {
    display: inline-block;
    margin-top: 20px;
    color: #5eead4;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
  <main class="launch-card">
    <span aria-hidden="true">📈</span>
    <h1>%เกรดและปัญหาประจำวัน</h1>
    <p id="launch-status">กำลังตรวจสิทธิ์และเปิดหน้าแดชบอร์ด…</p>
    <a href="dashboard_home.html">กลับหน้าหลัก</a>
  </main>

<script>
const GRADE_DASHBOARD_BASE_URL = 'https://aaf-grade-insight-2569.bbeautybbsoraai.chatgpt.site/';

let session = null;
try {
  session = JSON.parse(sessionStorage.getItem('aaf_user') || 'null');
} catch (error) {
  session = null;
}

if (!session) {
  window.location.replace('login.html');
} else if (!['admin', 'production', 'grade_admin'].includes(session.role)) {
  const fallback = session.role === 'purchase_material'
    ? 'production_plan.html'
    : 'dashboard_home.html';
  window.location.replace(fallback);
} else {
  const accessMode = session.role === 'production' ? 'viewer' : 'editor';
  const dashboardUrl = `${GRADE_DASHBOARD_BASE_URL}?source=aaf-system&access=${accessMode}#overview`;
  window.location.replace(dashboardUrl);
}
</script>
</body>
</html>
