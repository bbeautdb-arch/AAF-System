<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://aaf-grade-insight-2569.bbeautybbsoraai.chatgpt.site https://aaf-hr-attendance.bbeautybbsoraai.chatgpt.site https://hardboard-maintenance-hb1.bbeautybbsoraai.chatgpt.site https://kabin-close.bbeautybbsoraai.chatgpt.site https://ipapi.co https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>AAF Company Portal — Login</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  body {
    position: relative;
    background: url('login-bg.png') center center / cover no-repeat;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 6vh;
  }
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(13,17,23,0.45) 0%, rgba(13,17,23,0.08) 30%, rgba(13,17,23,0.08) 60%, rgba(13,17,23,0.55) 100%);
    pointer-events: none;
  }
  .login-card {
    position: relative;
    z-index: 1;
    width: 300px;
    background: rgba(255,255,255,0.16);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 18px;
    padding: 28px 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .login-card input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.4);
    color: #0d1117;
    font-size: 14px;
    margin-bottom: 14px;
    outline: none;
    transition: background 0.2s;
  }
  .login-card input::placeholder { color: #374151; }
  .login-card input:focus { background: rgba(255,255,255,0.58); }
  .login-card button#btn-login {
    width: 100%;
    padding: 13px;
    border-radius: 24px;
    border: none;
    background: linear-gradient(180deg, #3b82f6, #1d4ed8);
    color: white;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(29,78,216,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .login-card button#btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(29,78,216,0.6); }
  .login-card button#btn-login:active { transform: scale(0.98); }
  .login-card button#btn-login:disabled { opacity: 0.6; cursor: default; transform: none; }
  .err-msg {
    background: rgba(239,68,68,0.28);
    border: 1px solid rgba(239,68,68,0.5);
    color: #fecaca;
    font-size: 12.5px;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
    text-align: center;
    display: none;
  }
  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; width: auto; padding: 0;
    color: #374151; font-size: 12px; cursor: pointer; box-shadow: none;
    font-weight: 600;
  }
  .pw-toggle:hover { transform: translateY(-50%); box-shadow: none; }
  @media (max-width: 640px) {
    .login-card { width: 88%; max-width: 300px; }
    body { padding-top: 5vh; }
  }
</style>
</head>
<body>

<div class="login-card">
  <div id="error-msg" class="err-msg">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>

  <input id="username" type="text" aria-label="ชื่อผู้ใช้" autocomplete="username" maxlength="64" placeholder="Username"
    onkeydown="if(event.key==='Enter') document.getElementById('password').focus()">

  <div class="pw-wrap">
    <input id="password" type="password" aria-label="รหัสผ่าน" autocomplete="current-password" maxlength="256" placeholder="Password"
      onkeydown="if(event.key==='Enter') doLogin()" style="padding-right:50px">
    <button class="pw-toggle" onclick="togglePw()" type="button">SHOW</button>
  </div>

  <button id="btn-login" onclick="doLogin()" style="margin-top:6px">SIGN IN</button>
</div>

<p style="position:fixed;bottom:8px;left:8px;color:rgba(255,255,255,0.5);font-size:11px;z-index:5">v8-2026-08-29</p>

<script>


const GRADE_AUTH_API = 'https://aaf-grade-insight-2569.bbeautybbsoraai.chatgpt.site/api/aaf/login';
const STOCK_AUTH_API = 'https://aaf-grade-insight-2569.bbeautybbsoraai.chatgpt.site/api/aaf/stock/login';
const HR_AUTH_API = 'https://aaf-hr-attendance.bbeautybbsoraai.chatgpt.site/api/aaf/login';
const MAINTENANCE_AUTH_API = 'https://hardboard-maintenance-hb1.bbeautybbsoraai.chatgpt.site/api/aaf/login';
const CLOSING_AUTH_API = 'https://kabin-close.bbeautybbsoraai.chatgpt.site/api/aaf/login';

const USERS = {
  'vee': { serverAuth: true, authApi: STOCK_AUTH_API, authSource: 'stock', role: 'stock_viewer', name: 'วี', salesman: null },
  // บัญชีที่เข้าแดชบอร์ดเกรดตรวจรหัสผ่านที่ server และไม่เก็บรหัสไว้ใน HTML
  'admin':    { serverAuth: true, role: 'admin',  name: 'Admin',       salesman: null },
  'boss':     { serverAuth: true, role: 'admin',  name: 'ผู้บริหาร',    salesman: null },
  'hraaf':    { serverAuth: true, authApi: HR_AUTH_API, authSource: 'hr', role: 'hr', name: 'ฝ่ายทรัพยากรบุคคล', salesman: null },
  'ช่างaaf':  { serverAuth: true, authApi: MAINTENANCE_AUTH_API, authSource: 'maintenance', role: 'maintenance', name: 'ช่าง AAF', salesman: null },
  'accounting': { serverAuth: true, authApi: CLOSING_AUTH_API, authSource: 'closing', role: 'accounting', name: 'ฝ่ายบัญชี', salesman: null },
  'nok':      { serverAuth: true, authApi: STOCK_AUTH_API, authSource: 'stock', serverRole: 'stock_viewer', role: 'sales', name: 'Nok', salesman: 'Nok' },
  'kim':      { serverAuth: true, authApi: STOCK_AUTH_API, authSource: 'stock', serverRole: 'stock_viewer', role: 'sales', name: 'Kim', salesman: 'Kim' },
  'lek':      { serverAuth: true, authApi: STOCK_AUTH_API, authSource: 'stock', serverRole: 'stock_viewer', role: 'sales', name: 'Lek', salesman: 'Lek' },
  'tor':      { serverAuth: true, authApi: STOCK_AUTH_API, authSource: 'stock', serverRole: 'stock_viewer', role: 'sales', name: 'Tor', salesman: 'Tor' },
  'angkana':  { serverAuth: true, authApi: STOCK_AUTH_API, authSource: 'stock', serverRole: 'stock_viewer', role: 'sales', name: 'K.Angkana', salesman: 'K.Angkana' },
  'than':     { serverAuth: true, authApi: STOCK_AUTH_API, authSource: 'stock', serverRole: 'stock_viewer', role: 'sales', name: 'Than', salesman: 'Than' },
  'opthantiva': { serverAuth: true, authApi: STOCK_AUTH_API, authSource: 'stock', serverRole: 'stock_viewer', role: 'sales', name: 'Thantiva', salesman: 'Thantiva' },
  // หัวหน้ากะผลิต — เห็นหน้าแผนผลิต (ดูอย่างเดียว) และหน้าสรุปเกรด/ปัญหาประจำวัน
  'shift1':   { serverAuth: true, role: 'production', name: 'หัวหน้ากะ 1', salesman: null },
  // ผู้ลงข้อมูลเกรด — เข้าได้เฉพาะหน้า %เกรดและปัญหาประจำวัน (สิทธิ์บันทึก/แก้ไข)
  'chen':     { serverAuth: true, role: 'grade_admin', name: 'ผู้ลงข้อมูลเกรด', salesman: null },
  // จัดซื้อวัตถุดิบ — เห็นเฉพาะหน้าจัดซื้อวัตถุดิบ (ดู KPI เป้า + กรอกผลจัดซื้อจริงประจำวัน)
  'purchase1': { serverAuth:true, authApi:'https://aaf-grade-insight-2569.bbeautybbsoraai.chatgpt.site/api/aaf/portal/login', authSource:'portal', role: 'purchase_material', name: 'จัดซื้อวัตถุดิบ', salesman: null },
};

function togglePw() {
  const pw = document.getElementById('password');
  const btn = document.querySelector('.pw-toggle');
  pw.type = pw.type === 'password' ? 'text' : 'password';
  btn.textContent = pw.type === 'password' ? 'SHOW' : 'HIDE';
}

function detectDevice() {
  const ua = navigator.userAgent;
  let os = 'Unknown OS';
  if (/Windows/.test(ua)) os = 'Windows';
  else if (/Mac OS/.test(ua) && !/iPhone|iPad/.test(ua)) os = 'Mac';
  else if (/iPhone/.test(ua)) os = 'iPhone';
  else if (/iPad/.test(ua)) os = 'iPad';
  else if (/Android/.test(ua)) os = 'Android';
  else if (/Linux/.test(ua)) os = 'Linux';
  let browser = 'Unknown';
  if (/Edg\//.test(ua)) browser = 'Edge';
  else if (/Chrome\//.test(ua) && !/Edg\//.test(ua)) browser = 'Chrome';
  else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
  else if (/Firefox\//.test(ua)) browser = 'Firefox';
  return `${browser} on ${os}`;
}

function logAttempt() {}

async function doLogin() {
  if(document.getElementById('btn-login').disabled)return;
  const enteredUser = document.getElementById('username').value.trim().toLowerCase();
  const user = enteredUser === 'op thantiva' ? 'opthantiva' : enteredUser;
  const pass = document.getElementById('password').value.trim();
  const errEl = document.getElementById('error-msg');

  if(!user || !pass) { errEl.style.display = 'block'; return; }

  const configured = USERS[user];
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';

  let found = configured;
  let bridgeSessionToken = null;
  let authSource = null;
  if (configured?.serverAuth) {
    try {
      const response = await fetch(configured.authApi || GRADE_AUTH_API, {
        method: 'POST',
        mode: 'cors',
        cache: 'no-store',
        signal: AbortSignal.timeout(20000),
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({ username: user, password: pass }),
      });
      const result = await response.json();
      const returnedUsername = String(result.user?.username || '').trim().toLowerCase();
      if (!response.ok || !result.ok || !result.user || !result.bridgeSessionToken ||
          returnedUsername !== user || result.user.role !== (configured.serverRole || configured.role)) {
        found = null;
      } else {
        found = { ...result.user, role: configured.role, salesman: configured.salesman };
        bridgeSessionToken = result.bridgeSessionToken;
        authSource = configured.authSource || 'grade';
      }
    } catch (error) {
      found = null;
    }
  } else if (!configured || configured.password !== pass) {
    found = null;
  }

  if(!found) {
    errEl.style.display = 'block';
    document.getElementById('password').value = '';
    logAttempt(user, false, '');
    setTimeout(()=>{ btn.disabled=false; btn.textContent='SIGN IN'; }, 600);
    return;
  }

  logAttempt(user, true, found.role);

  sessionStorage.setItem('aaf_user', JSON.stringify({
    username: user, name: found.name, role: found.role,
    salesman: found.salesman, loginAt: new Date().toISOString(),
    bridgeSessionToken: bridgeSessionToken,
    gradeBridgeSessionToken: authSource === 'grade' ? bridgeSessionToken : null,
    stockSessionToken: authSource === 'stock' ? bridgeSessionToken : null,
    authSource: authSource,
  }));

  const target = found.role === 'stock_viewer' ? 'stock_manager.html' : found.role === 'purchase_material' ? 'production_plan.html' : 'dashboard_home.html';
  setTimeout(()=>{ window.location.href = target; }, 300);
}

if(new URLSearchParams(location.search).has('reauth')) sessionStorage.removeItem('aaf_user');
const sess = sessionStorage.getItem('aaf_user');
if(sess){
  try{
    const parsed = JSON.parse(sess);
    window.location.href = parsed.role === 'stock_viewer' ? 'stock_manager.html' : parsed.role === 'purchase_material' ? 'production_plan.html' : 'dashboard_home.html';
  }catch(e){
    sessionStorage.removeItem('aaf_user');
  }
}

document.getElementById('username').focus();
</script>
</body>
</html>
