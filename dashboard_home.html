<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAF Company Portal — หน้าหลัก</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen">

<div class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <span class="text-2xl">🪵</span>
    <div>
      <h1 class="text-white font-bold text-base">AAF Company Portal</h1>
      <p id="welcome-text" class="text-gray-400 text-xs"></p>
    </div>
  </div>
  <div class="flex items-center gap-3">
    <span id="role-badge" class="text-xs px-3 py-1 rounded-full font-semibold"></span>
    <button onclick="doLogout()"
      class="text-xs text-gray-500 hover:text-red-400 border border-gray-600 hover:border-red-500/50 rounded-lg px-3 py-1.5 transition">
      ออกจากระบบ
    </button>
  </div>
</div>

<div class="max-w-2xl mx-auto px-6 py-10">
  <p class="text-gray-500 text-sm mb-6">เลือกหน้าที่ต้องการ</p>
  <div id="pages-container" class="grid grid-cols-1 gap-4"></div>
  <div id="sales-note" class="hidden mt-6 bg-amber-900/20 border border-amber-500/20 rounded-xl p-4">
    <p class="text-amber-400 text-xs font-semibold mb-1">📌 หมายเหตุ</p>
    <p class="text-amber-200/60 text-xs">ข้อมูลที่แสดงจะ filter เฉพาะของคุณอัตโนมัติ</p>
  </div>
</div>

<script>
const PAGES = {
  admin: [
    { href: 'https://hardboard-maintenance-hb1.bbeautybbsoraai.chatgpt.site/', icon: '🛠️', title: 'งานช่าง PM / CM และแจ้งซ่อม',
      desc: 'ทะเบียนเครื่องจักร · แจ้งซ่อมและ Warning · แผน PM · ใบงาน CM · แนบรูปยืนยัน',
      color: 'orange', badge: 'ทีมช่าง · ฝ่ายผลิต' },
    { href: 'production_plan.html', icon: '🏭', title: 'แผนผลิตประจำวัน',
      desc: 'กรอกความหนา/ชม.ผลิต · เป้า 4x8 อัตโนมัติ · Rev.04',
      color: 'amber', badge: 'Admin' },
    { href: 'grade_quality_dashboard.html', icon: '📈', title: '%เกรดและปัญหาประจำวัน',
      desc: 'สรุปเกรด · ปัญหาคุณภาพรายวัน · แยก Line และ Code',
      color: 'teal', badge: 'Admin · Shift 1' },
    { href: 'hr_dashboard.html', icon: '👥', title: 'ระบบ HR',
      desc: 'ทะเบียนพนักงาน · ขาด ลา สาย · เวลาเข้างาน · ประวัติรายบุคคล',
      color: 'cyan', badge: 'Admin · HR' },
    { href: 'history_database.html', icon: '📊', title: 'ฐานข้อมูลประวัติการขาย',
      desc: 'ยอดขาย 2014–2026 · Timeline · Insights · Health Score · Price Trend',
      color: 'green', badge: 'ทุกคน' },
    { href: 'sales_analytics.html',  icon: '🏆', title: 'Sales Analytics',
      desc: 'ยอดขายแยกตามเซลส์ · Follow-up list · Export CSV',
      color: 'purple', badge: 'ทุกคน' },
    { href: 'stock_manager.html', icon: '📦', title: 'Stock AAF',
      desc: 'สต๊อกคงเหลือ · Aging · ฟรีสต๊อก · มูลค่าสต๊อก · อัปเดตทุกวันจาก Auto Mail',
      color: 'emerald', badge: 'Admin · ฝ่ายขาย' },
    { href: 'history_dashboard.html',icon: '📜', title: 'ประวัติการโหลด',
      desc: 'Archive ยอดปิดเดือนย้อนหลัง',
      color: 'blue', badge: 'Admin' },
    { href: 'access_log.html',icon: '🔒', title: 'บันทึกการเข้าใช้งาน',
      desc: 'ใครเข้าเมื่อไร · ความถี่ · พยายามเข้าไม่สำเร็จ',
      color: 'red', badge: 'Admin เท่านั้น' },
  ],
  production: [
    { href: 'https://hardboard-maintenance-hb1.bbeautybbsoraai.chatgpt.site/', icon: '🛠️', title: 'งานช่าง PM / CM และแจ้งซ่อม',
      desc: 'แจ้งซ่อม · บันทึก Warning · ดูสถานะเครื่องจักร · ติดตามงานซ่อม',
      color: 'orange', badge: 'ฝ่ายผลิต · ทีมช่าง' },
    { href: 'production_plan.html', icon: '🏭', title: 'แผนผลิตประจำวัน',
      desc: 'ดูแผนผลิตประจำวันของ Line 1–3',
      color: 'amber', badge: 'ดูอย่างเดียว' },
    { href: 'grade_quality_dashboard.html', icon: '📈', title: '%เกรดและปัญหาประจำวัน',
      desc: 'สรุปเกรด · ปัญหาคุณภาพรายวัน · แยก Line และ Code',
      color: 'teal', badge: 'Shift 1' },
  ],
  grade_admin: [
    { href: 'grade_quality_dashboard.html', icon: '📈', title: '%เกรดและปัญหาประจำวัน',
      desc: 'อัปโหลด · ตรวจสอบ · บันทึกข้อมูลเกรดและปัญหาประจำวัน',
      color: 'teal', badge: 'ผู้ลงข้อมูล' },
  ],
  hr: [
    { href: 'hr_dashboard.html', icon: '👥', title: 'ระบบ HR',
      desc: 'ทะเบียนพนักงาน · ขาด ลา สาย · เวลาเข้างาน · ประวัติรายบุคคล',
      color: 'cyan', badge: 'ฝ่าย HR' },
  ],
  maintenance: [
    { href: 'https://hardboard-maintenance-hb1.bbeautybbsoraai.chatgpt.site/', icon: '🛠️', title: 'งานช่าง PM / CM และแจ้งซ่อม',
      desc: 'ทะเบียนเครื่องจักร · Warning · แผน PM · ใบงาน CM · แนบรูปยืนยัน',
      color: 'orange', badge: 'ทีมช่าง' },
  ],
  sales: [
    { href: 'history_database.html', icon: '📊', title: 'ฐานข้อมูลประวัติการขาย',
      desc: 'ยอดขาย · Timeline · Health Score',
      color: 'green', badge: '' },
    { href: 'sales_analytics.html',  icon: '🏆', title: 'Sales Analytics',
      desc: 'ยอดขายของฉัน · Follow-up list · Export CSV',
      color: 'purple', badge: '' },
    { href: 'stock_manager.html', icon: '📦', title: 'Stock AAF',
      desc: 'ตรวจสอบสต๊อกคงเหลือ · Aging · ฟรีสต๊อก · มูลค่าสต๊อก',
      color: 'emerald', badge: 'อัปเดตทุกวัน' },
  ],
};

const COLORS = {
  orange: { border: 'border-orange-500/30', hover: 'hover:border-orange-400/60', arrow: 'group-hover:text-orange-400' },
  amber:  { border: 'border-amber-500/30',  hover: 'hover:border-amber-400/60',  arrow: 'group-hover:text-amber-400' },
  green:  { border: 'border-green-500/30',  hover: 'hover:border-green-400/60',  arrow: 'group-hover:text-green-400' },
  emerald:{ border: 'border-emerald-500/30',hover: 'hover:border-emerald-400/60',arrow: 'group-hover:text-emerald-400' },
  teal:   { border: 'border-teal-500/30',   hover: 'hover:border-teal-400/60',   arrow: 'group-hover:text-teal-400' },
  cyan:   { border: 'border-cyan-500/30',   hover: 'hover:border-cyan-400/60',   arrow: 'group-hover:text-cyan-400' },
  purple: { border: 'border-purple-500/30', hover: 'hover:border-purple-400/60', arrow: 'group-hover:text-purple-400' },
  blue:   { border: 'border-blue-500/30',   hover: 'hover:border-blue-400/60',   arrow: 'group-hover:text-blue-400' },
  red:    { border: 'border-red-500/30',    hover: 'hover:border-red-400/60',    arrow: 'group-hover:text-red-400' },
};

const sess = sessionStorage.getItem('aaf_user');
if(!sess) { window.location.href = 'login.html'; }
let user = null;
try { user = JSON.parse(sess); } catch (error) { user = null; }
if(!user || !PAGES[user.role]) {
  sessionStorage.clear();
  window.location.replace('login.html');
  throw new Error('invalid_session_role');
}

document.getElementById('welcome-text').textContent = `สวัสดี, ${user.name}`;
const badge = document.getElementById('role-badge');
if(user.role === 'admin') {
  badge.textContent = '👑 ผู้บริหาร';
  badge.className = 'text-xs px-3 py-1 rounded-full font-semibold bg-amber-900/40 text-amber-400 border border-amber-500/30';
} else if(user.role === 'production') {
  badge.textContent = '🏭 หัวหน้ากะผลิต';
  badge.className = 'text-xs px-3 py-1 rounded-full font-semibold bg-teal-900/40 text-teal-400 border border-teal-500/30';
} else if(user.role === 'grade_admin') {
  badge.textContent = '📝 ผู้ลงข้อมูลเกรด';
  badge.className = 'text-xs px-3 py-1 rounded-full font-semibold bg-teal-900/40 text-teal-400 border border-teal-500/30';
} else if(user.role === 'hr') {
  badge.textContent = '👥 ฝ่าย HR';
  badge.className = 'text-xs px-3 py-1 rounded-full font-semibold bg-cyan-900/40 text-cyan-400 border border-cyan-500/30';
} else if(user.role === 'maintenance') {
  badge.textContent = '🛠️ ทีมช่าง';
  badge.className = 'text-xs px-3 py-1 rounded-full font-semibold bg-orange-900/40 text-orange-400 border border-orange-500/30';
} else {
  badge.textContent = `🏷 เซลส์`;
  badge.className = 'text-xs px-3 py-1 rounded-full font-semibold bg-blue-900/40 text-blue-400 border border-blue-500/30';
  document.getElementById('sales-note').classList.remove('hidden');
}

if(user.salesman) sessionStorage.setItem('aaf_filter_salesman', user.salesman);
else sessionStorage.removeItem('aaf_filter_salesman');

const pages = PAGES[user.role];
const container = document.getElementById('pages-container');
container.innerHTML = pages.map(p => {
  const c = COLORS[p.color];
  return `<a href="${p.href}" class="block bg-gray-800 border ${c.border} ${c.hover} rounded-xl p-5 transition group">
    <div class="flex items-center gap-4">
      <div class="text-3xl">${p.icon}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <p class="text-white font-semibold ${c.arrow} transition">${p.title}</p>
          ${p.badge ? `<span class="text-xs bg-gray-700 text-gray-400 px-2 py-0.5 rounded-full">${p.badge}</span>` : ''}
        </div>
        <p class="text-gray-400 text-sm mt-0.5">${p.desc}</p>
      </div>
      <div class="text-gray-600 ${c.arrow} transition text-xl flex-shrink-0">→</div>
    </div>
  </a>`;
}).join('');

function doLogout() {
  if(!confirm('ออกจากระบบ?')) return;
  sessionStorage.clear();
  const portalLogin = 'https://bbeautdb-arch.github.io/AAF-System/login.html';
  const gradeLogout = 'https://aaf-grade-insight-2569.bbeautybbsoraai.chatgpt.site/api/aaf/logout?next=' + encodeURIComponent(portalLogin);
  window.location.href = 'https://aaf-hr-attendance.bbeautybbsoraai.chatgpt.site/api/aaf/logout?next=' + encodeURIComponent(gradeLogout);
}
</script>
</body>
</html>
