<style>

  .portal-card-row { gap: 16px; }.card-icon { flex: 0 0 auto; font-size: 30px; }.card-copy { flex: 1; min-width: 0; }.portal-card-title { gap: 8px; }.portal-card-title p { margin: 0; color: #fff; font-weight: 700; }.card-copy>p { margin: 4px 0 0; color: #9ca3af; font-size: 14px; }.card-badge { padding: 2px 8px; color: #9ca3af; background: #374151; font-size: 11px; }.card-arrow { flex: 0 0 auto; color: #4b5563; font-size: 20px; }
  .card-orange { border-color: rgba(249,115,22,.3); }.card-orange:hover { border-color: rgba(251,146,60,.65); }.card-orange:hover .portal-card-title p,.card-orange:hover .card-arrow { color: #fb923c; }
  .card-amber { border-color: rgba(245,158,11,.3); }.card-amber:hover { border-color: rgba(251,191,36,.65); }.card-amber:hover .portal-card-title p,.card-amber:hover .card-arrow { color: #fbbf24; }
  .card-green { border-color: rgba(34,197,94,.3); }.card-green:hover { border-color: rgba(74,222,128,.65); }.card-green:hover .portal-card-title p,.card-green:hover .card-arrow { color: #4ade80; }
  .card-emerald { border-color: rgba(16,185,129,.3); }.card-emerald:hover { border-color: rgba(52,211,153,.65); }.card-emerald:hover .portal-card-title p,.card-emerald:hover .card-arrow { color: #34d399; }

  .card-cyan { border-color: rgba(6,182,212,.3); }.card-cyan:hover { border-color: rgba(34,211,238,.65); }.card-cyan:hover .portal-card-title p,.card-cyan:hover .card-arrow { color: #22d3ee; }

  .card-blue { border-color: rgba(59,130,246,.3); }.card-blue:hover { border-color: rgba(96,165,250,.65); }.card-blue:hover .portal-card-title p,.card-blue:hover .card-arrow { color: #60a5fa; }

  .sales-note { margin-top: 24px; padding: 16px; border: 1px solid rgba(245,158,11,.2); border-radius: 12px; background: rgba(120,53,15,.2); }.sales-note p { margin: 0; color: rgba(253,230,138,.65); font-size: 12px; }.sales-note p:first-child { margin-bottom: 4px; color: #fbbf24; font-weight: 700; }.hidden { display: none; }

<body>

<header class="portal-header">
  <div class="portal-brand">
    <span class="portal-logo">🪵</span>
    <div>
      <h1>AAF Company Portal</h1>
      <p id="welcome-text"></p>
    </div>
  </div>
  <div class="portal-user-actions">
    <span id="role-badge" class="role-badge"></span>
    <button onclick="doLogout()" class="logout-button">ออกจากระบบ</button>
  </div>
</header>

<main class="portal-main">
  <p>เลือกหน้าที่ต้องการ</p>
  <div id="pages-container" class="pages"></div>
  <div id="sales-note" class="sales-note hidden">
    <p>📌 หมายเหตุ</p>
    <p>ข้อมูลที่แสดงจะ filter เฉพาะของคุณอัตโนมัติ</p>
  </div>
</main>

<script>
const PAGES = {
  stock_viewer: [
    { href: 'stock_manager.html', icon: '📦', title: 'Stock AAF',
      desc: 'ดูสต๊อกล่าสุด · ดาวน์โหลดรายงาน Excel ประจำวัน', color: 'emerald', badge: 'ดูและดาวน์โหลดเท่านั้น' },
    { href: 'stock_report.html', icon: '📄', title: 'รายงานสต๊อก',

  ],
  admin: [
    { href: 'accounting_dashboard.html', icon: '📒', title: 'แผนบัญชี',
      desc: 'ระบบปิดตู้ขาย · ตรวจค่าแรงผู้รับเหมา',
      color: 'green', badge: 'Admin · บัญชี' },
    { href: 'maintenance_dashboard.html', icon: '🛠️', title: 'งานช่าง PM / CM และแจ้งซ่อม',
      desc: 'ทะเบียนเครื่องจักร · แจ้งซ่อมและ Warning · แผน PM · ใบงาน CM · แนบรูปยืนยัน',
      color: 'orange', badge: 'ทีมช่าง · ฝ่ายผลิต' },
    { href: 'production_plan.html', icon: '🏭', title: 'แผนผลิตประจำวัน',
      desc: 'กรอกความหนา/ชม.ผลิต · เป้า 4x8 อัตโนมัติ · Rev.04',
      color: 'amber', badge: 'Admin' },
    { href: 'grade_quality_dashboard.html', icon: '📈', title: '%เกรดและปัญหาประจำวัน',
      desc: 'สรุปเกรด · ปัญหาคุณภาพรายวัน · แยก Line และ Code',
      color: 'teal', badge: 'Admin · Shift 1' },
    { href: 'hr_dashboard.html', icon: '👥', title: 'ระบบ HR',
      desc: 'ทะเบียนพนักงาน · ขาด ลา สาย · เวลาเข้างาน · ประวัติรายบุคคล',
      color: 'cyan', badge: 'Admin · HR' },
    { href: 'history_database.html', icon: '📊', title: 'ฐานข้อมูลประวัติการขาย',
      desc: 'ยอดขาย 2014–2026 · Timeline · Insights · Health Score · Price Trend',
      color: 'green', badge: 'ทุกคน' },
    { href: 'sales_analytics.html',  icon: '🏆', title: 'Sales Analytics',
      desc: 'ยอดขายแยกตามเซลส์ · Follow-up list · Export CSV',
      color: 'purple', badge: 'ทุกคน' },
    { href: 'stock_manager.html', icon: '📦', title: 'Stock AAF',
      desc: 'สต๊อกคงเหลือ · Aging · ฟรีสต๊อก · มูลค่าสต๊อก · อัปเดตทุกวันจาก Auto Mail',
      color: 'emerald', badge: 'Admin · ฝ่ายขาย' },
    { href: 'stock_report.html', icon: '📄', title: 'รายงานสต๊อก',
      desc: 'สรุปครบทุกสเปก · ติดตามขายและหมายเหตุ · ดาวน์โหลดภาพยาว', color: 'teal', badge: 'Admin · ฝ่ายขาย' },
    { href: 'history_dashboard.html',icon: '📜', title: 'ประวัติการโหลด',
      desc: 'Archive ยอดปิดเดือนย้อนหลัง',
      color: 'blue', badge: 'Admin' },
    { href: 'access_log.html',icon: '🔒', title: 'บันทึกการเข้าใช้งาน',
      desc: 'ใครเข้าเมื่อไร · ความถี่ · พยายามเข้าไม่สำเร็จ',
      color: 'red', badge: 'Admin เท่านั้น' },
  ],
  production: [
    { href: 'maintenance_dashboard.html', icon: '🛠️', title: 'งานช่าง PM / CM และแจ้งซ่อม',
      desc: 'แจ้งซ่อม · บันทึก Warning · ดูสถานะเครื่องจักร · ติดตามงานซ่อม',
      color: 'orange', badge: 'ฝ่ายผลิต · ทีมช่าง' },
    { href: 'production_plan.html', icon: '🏭', title: 'แผนผลิตประจำวัน',
      desc: 'ดูแผนผลิตประจำวันของ Line 1–3',
      color: 'amber', badge: 'ดูอย่างเดียว' },
    { href: 'grade_quality_dashboard.html', icon: '📈', title: '%เกรดและปัญหาประจำวัน',
      desc: 'สรุปเกรด · ปัญหาคุณภาพรายวัน · แยก Line และ Code',
      color: 'teal', badge: 'Shift 1' },
  ],
  grade_admin: [
    { href: 'grade_quality_dashboard.html', icon: '📈', title: '%เกรดและปัญหาประจำวัน',
      desc: 'อัปโหลด · ตรวจสอบ · บันทึกข้อมูลเกรดและปัญหาประจำวัน',
      color: 'teal', badge: 'ผู้ลงข้อมูล' },
  ],
  hr: [
    { href: 'hr_dashboard.html', icon: '👥', title: 'ระบบ HR',
      desc: 'ทะเบียนพนักงาน · ขาด ลา สาย · เวลาเข้างาน · ประวัติรายบุคคล',
      color: 'cyan', badge: 'ฝ่าย HR' },
  ],
  maintenance: [
    { href: 'maintenance_dashboard.html', icon: '🛠️', title: 'งานช่าง PM / CM และแจ้งซ่อม',
      desc: 'ทะเบียนเครื่องจักร · Warning · แผน PM · ใบงาน CM · แนบรูปยืนยัน',
      color: 'orange', badge: 'ทีมช่าง' },
  ],
  accounting: [
    { href: 'accounting_dashboard.html', icon: '📒', title: 'แผนบัญชี',
      desc: 'ระบบปิดตู้ขาย · ตรวจค่าแรงผู้รับเหมา',
      color: 'green', badge: 'ฝ่ายบัญชี' },
  ],
  sales: [
    { href: 'history_database.html', icon: '📊', title: 'ฐานข้อมูลประวัติการขาย',
      desc: 'ยอดขาย · Timeline · Health Score',
      color: 'green', badge: '' },
    { href: 'sales_analytics.html',  icon: '🏆', title: 'Sales Analytics',
      desc: 'ยอดขายของฉัน · Follow-up list · Export CSV',
      color: 'purple', badge: '' },
    { href: 'stock_manager.html', icon: '📦', title: 'Stock AAF',
      desc: 'ตรวจสอบสต๊อกคงเหลือ · Aging · ฟรีสต๊อก · มูลค่าสต๊อก',
      color: 'emerald', badge: 'อัปเดตทุกวัน' },
    { href: 'stock_report.html', icon: '📄', title: 'รายงานสต๊อก',
      desc: 'สรุปครบทุกสเปก · ติดตามขายและหมายเหตุ · ดาวน์โหลดภาพยาว', color: 'teal', badge: 'ดูข้อมูลที่บันทึกแล้ว' },
  ],
};

const sess = sessionStorage.getItem('aaf_user');
if(!sess) { window.location.href = 'login.html'; }
let user = null;
try { user = JSON.parse(sess); } catch (error) { user = null; }
if(!user || !PAGES[user.role]) {
  sessionStorage.clear();
  window.location.replace('login.html');
  throw new Error('invalid_session_role');
}

document.getElementById('welcome-text').textContent = `สวัสดี, ${user.name}`;
const badge = document.getElementById('role-badge');
if(user.role === 'admin') {
  badge.textContent = '👑 ผู้บริหาร';
  badge.className = 'role-badge badge-admin';
} else if(user.role === 'production') {
  badge.textContent = '🏭 หัวหน้ากะผลิต';
  badge.className = 'role-badge badge-production';
} else if(user.role === 'grade_admin') {
  badge.textContent = '📝 ผู้ลงข้อมูลเกรด';
  badge.className = 'role-badge badge-grade';
} else if(user.role === 'hr') {
  badge.textContent = '👥 ฝ่าย HR';
  badge.className = 'role-badge badge-hr';
} else if(user.role === 'maintenance') {
  badge.textContent = '🛠️ ทีมช่าง';
  badge.className = 'role-badge badge-maintenance';
} else if(user.role === 'accounting') {
  badge.textContent = '🧾 ฝ่ายบัญชี';
  badge.className = 'role-badge badge-accounting';
} else {
  badge.textContent = `🏷 เซลส์`;
  badge.className = 'role-badge badge-sales';
  document.getElementById('sales-note').classList.remove('hidden');
}

if(user.salesman) sessionStorage.setItem('aaf_filter_salesman', user.salesman);
else sessionStorage.removeItem('aaf_filter_salesman');

const pages = PAGES[user.role];
const container = document.getElementById('pages-container');
container.innerHTML = pages.map(p => {
  return `<a href="${p.href}" class="portal-card card-${p.color}">
    <div class="portal-card-row">
      <div class="card-icon">${p.icon}</div>
      <div class="card-copy">
        <div class="portal-card-title">
          <p>${p.title}</p>
          ${p.badge ? `<span class="card-badge">${p.badge}</span>` : ''}
        </div>
        <p>${p.desc}</p>
      </div>
      <div class="card-arrow">→</div>
    </div>
  </a>`;
}).join('');

function doLogout() {
  if(!confirm('ออกจากระบบ?')) return;
  location.href='portal_logout.html';
}
</script>
</body>
</html>
