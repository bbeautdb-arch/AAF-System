<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAF — ระบบ HR</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
  body { min-height: 100vh; display: grid; place-items: center; background: #0f1828; color: #e5edf7; }
  .launch-card { width: min(520px, calc(100% - 40px)); padding: 32px; border: 1px solid rgba(34,211,238,.28); border-radius: 20px; background: #1d2939; box-shadow: 0 24px 64px rgba(0,0,0,.28); text-align: center; }
  .launch-card span { display: block; font-size: 44px; margin-bottom: 12px; }
  .launch-card h1 { margin: 0 0 8px; font-size: 24px; }
  .launch-card p { margin: 0; color: #9ba8ba; line-height: 1.65; }
  .launch-card a { display: inline-block; margin-top: 20px; color: #67e8f9; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <main class="launch-card">
    <span aria-hidden="true">👥</span>
    <h1>ระบบ HR</h1>
    <p id="launch-status">กำลังตรวจสิทธิ์และเปิดหน้าระบบ HR…</p>
    <a href="dashboard_home.html">กลับหน้าหลัก</a>
  </main>

<script>
const HR_SITE_BASE_URL = 'https://aaf-hr-attendance.bbeautybbsoraai.chatgpt.site/';
const GRADE_SITE_BASE_URL = 'https://aaf-grade-insight-2569.bbeautybbsoraai.chatgpt.site/';

let session = null;
try { session = JSON.parse(sessionStorage.getItem('aaf_user') || 'null'); } catch (error) { session = null; }
launchHrDashboard();

async function launchHrDashboard() {
  if (!session) { window.location.replace('login.html'); return; }
  if (!['admin', 'hr'].includes(session.role)) { window.location.replace('dashboard_home.html'); return; }
  const bridgeSessionToken = session.bridgeSessionToken || session.gradeBridgeSessionToken;
  if (!bridgeSessionToken) {
    sessionStorage.removeItem('aaf_user');
    window.location.replace('login.html?reason=hr-auth-required');
    return;
  }

  const launchBase = session.authSource === 'hr' ? HR_SITE_BASE_URL : GRADE_SITE_BASE_URL;
  const launchPath = session.authSource === 'hr' ? 'api/aaf/launch' : 'api/aaf/hr-launch';
  try {
    const response = await fetch(`${launchBase}${launchPath}`, {
      method: 'POST', mode: 'cors', cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({ bridgeSessionToken }),
    });
    const result = await response.json();
    if (!response.ok || !result.ok || !result.handoffUrl) throw new Error('launch_failed');
    window.location.replace(result.handoffUrl);
  } catch (error) {
    document.getElementById('launch-status').textContent = 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่';
    sessionStorage.removeItem('aaf_user');
    setTimeout(() => window.location.replace('login.html?reason=hr-session-expired'), 700);
  }
}
</script>
</body>
</html>
