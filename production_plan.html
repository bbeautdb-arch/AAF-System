};

function applyCostDataToDays(costByDay){
  Object.keys(costByDay).forEach(dayStr=>{
    const day = Number(dayStr);
    const c = costByDay[dayStr];
    if(!procurementActual[day]) procurementActual[day] = {};
    if(c.yucaActualReceived!=null){ procurementActual[day].yucaActualReceived = c.yucaActualReceived; }
    if(c.yucaActualPrice!=null){ procurementActual[day].yucaActualPrice = c.yucaActualPrice; }
    if(c.fuelActualReceived!=null){ procurementActual[day].fuelActualReceived = c.fuelActualReceived; }
    if(c.fuelActualPrice!=null){ procurementActual[day].fuelActualPrice = c.fuelActualPrice; }
    markDirtyPurchase(day);
  });
  renderAll();
}

// อ่านไฟล์รายงานการรับไม้ประจำเดือนจากบัญชี (รูปแบบ: แถวมีวันที่ในคอลัมน์แรก ตามด้วยแถวย่อยของแต่ละประเภทไม้
// รวมถึงแถว "ไม้ท่อนยูคา" และ "ไม้ท่อนเชื้อเพลิง" ที่ 3 คอลัมน์สุดท้าย = ปริมาณ(ตัน), บาท/ตัน, เป็นเงิน(บาท) รวม)
window.handleCostFileUpload = function(input){
  if(!IS_PURCHASE && !IS_ADMIN) return;
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const sheetName = wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, raw:true});
      const costByDay = {};
      const otherByDay = {};
      let currentDate = null;
      for(let i=3; i<rows.length; i++){
        const row = rows[i] || [];
        if(row[0] instanceof Date){ currentDate = row[0]; }
        const label = row[1];
        if(!currentDate) continue;
        const y = currentDate.getFullYear(), m = currentDate.getMonth()+1, d = currentDate.getDate();
        const ymKey = `${y}-${String(m).padStart(2,'0')}`;
        if(ymKey !== currentMonth) continue; // เอาเฉพาะเดือนที่กำลังดูอยู่
        const tons = row[20], price = row[21];
        if(tons==null || price==null || tons==='' || price==='') continue;
        if(label==='ไม้ท่อนยูคา' || label==='ไม้ท่อนเชื้อเพลิง'){
          if(!costByDay[d]) costByDay[d] = {};
          if(label==='ไม้ท่อนยูคา'){ costByDay[d].yucaActualReceived = Math.round(Number(tons)*100)/100; costByDay[d].yucaActualPrice = Math.round(Number(price)); }
          else { costByDay[d].fuelActualReceived = Math.round(Number(tons)*100)/100; costByDay[d].fuelActualPrice = Math.round(Number(price)); }
        } else if(OTHER_MATERIAL_TYPES.includes(label)){
          if(!otherByDay[d]) otherByDay[d] = {};
          otherByDay[d][label] = {tons: Math.round(Number(tons)*100)/100, price: Math.round(Number(price))};
        }
      }
      const days = Object.keys(costByDay);
      if(days.length===0){ alert('ไม่พบข้อมูลของเดือน ' + currentMonth + ' ในไฟล์นี้ — ตรวจสอบว่าเลือกเดือนถูกต้องหรือไฟล์ตรงรูปแบบไหม'); return; }
      if(!confirm(`พบข้อมูล ${days.length} วันในไฟล์ (วันที่ ${days.join(', ')}) จะเขียนทับ "รับเข้าจริง"/"ราคาจริง" ของยูคา+เชื้อเพลิง และไม้/เชื้อเพลิงประเภทอื่น (ชิพ/วีเนียร์/แกลบ/เศษฮาร์ดบอร์ด/เปลือกไม้) ของวันเหล่านี้ ดำเนินการต่อไหม?`)) return;
      applyCostDataToDays(costByDay);
      Object.keys(otherByDay).forEach(dayStr=>{
        const day = Number(dayStr);
        otherMaterialActual[day] = otherByDay[dayStr];
        markDirtyOtherMat(day);
      });
      renderAll();

window.calcPurchaseCatchup = async function(){
  if(!IS_PURCHASE) return;
  const ym = currentMonth;
  const nd = daysInMonth(ym);
  const asOfDay = Math.round(Number(document.getElementById('pcAsOfDay').value)) || nd;
  const yucaStockNow = Number(document.getElementById('pcYucaStock').value);
  const fuelStockNow = Number(document.getElementById('pcFuelStock').value);

  if(!Number.isFinite(yucaStockNow) || !Number.isFinite(fuelStockNow)){
    alert('กรุณากรอกสต๊อกจริงที่นับได้ทั้งยูคาและเชื้อเพลิงก่อนครับ');
    return;
  }
  if(asOfDay >= nd){
    alert('วันที่นับสต๊อกต้องน้อยกว่าวันสุดท้ายของเดือน ถึงจะมีวันเหลือให้ปรับแผน');
    return;
  }

  purchaseCheckpoint = {asOfDay, yucaStock: yucaStockNow, fuelStock: fuelStockNow};

  // คำนวณเบิกใช้ที่เหลือของเดือน (วันที่ asOfDay+1 ถึงสิ้นเดือน) ด้วยสูตรเดียวกับตารางหลัก
  const lines = ['Line 1','Line 2','Line 3'];
  let remainingYucaUsed = 0, remainingFuelUsed = 0;
  const remainingDays = [];
  for(let d=asOfDay+1; d<=nd; d++){
    let tonsStd=0, tonsTgt=0;
    const sizeMap = {};
    lines.forEach(line=>{
      const runs = planData[`${line}_${d}`] || [];
      runs.forEach(r=>{
        tonsStd += calcWoodTonsStandard(line, r);
        tonsTgt += calcWoodTonsTarget(line, r);
        if(r.thickness){
          const bd = calcRunSizeBreakdown(line, r);
          const STD_AREA_M2 = 1.22*2.44;
          let sc=0;
          bd.forEach(item=>{
            const areaM2 = (Number(item.w)||0)*(Number(item.l)||0);
            sc += item.count*(areaM2/STD_AREA_M2);
          });
          sizeMap[r.thickness] = (sizeMap[r.thickness]||0)+sc;
        }
      });
    });
    const yucaUsed = (tonsStd+tonsTgt)/2;
    remainingYucaUsed += yucaUsed;

    const thicknesses = Object.keys(sizeMap);
    let totalSc=0, weightedYieldSum=0;
    thicknesses.forEach(t=>{ const sc=sizeMap[t]; totalSc+=sc; weightedYieldSum += sc*getYieldRatio(Number(t)); });
    const avgYield = totalSc>0?weightedYieldSum/totalSc:0;
    const hardBoardTons = avgYield>0?yucaUsed/avgYield:0;
    const steamTons = hardBoardTons*steamRatePerTonFG;
    remainingFuelUsed += steamTons*fuelRatePerTonSteam;
    remainingDays.push(d);
  }

  const numRemaining = remainingDays.length;
  const requiredYuca = yucaEndStockTarget - yucaStockNow + remainingYucaUsed;
  const requiredFuel = fuelEndStockTarget - fuelStockNow + remainingFuelUsed;
  const rawYucaDaily = requiredYuca/numRemaining;
  const rawFuelDaily = requiredFuel/numRemaining;
  const dailyYuca = Math.round(Math.min(yucaDailyMax, Math.max(yucaDailyMin, rawYucaDaily))*100)/100;
  const dailyFuel = Math.round(Math.min(fuelDailyMax, Math.max(fuelDailyMin, rawFuelDaily))*100)/100;

  const achievableYuca = yucaStockNow + dailyYuca*numRemaining - remainingYucaUsed;
  const achievableFuel = fuelStockNow + dailyFuel*numRemaining - remainingFuelUsed;
  const yucaClamped = Math.abs(dailyYuca-rawYucaDaily) > 0.01;
  const fuelClamped = Math.abs(dailyFuel-rawFuelDaily) > 0.01;

  let msg = `แผนวันที่ ${asOfDay+1}-${nd} (${numRemaining} วัน):\n`;
  msg += `ยูคาวันละ ${dailyYuca} ตัน${yucaClamped?` (ติดเพดานรับได้จริง — จะได้สต๊อกปลายเดือนประมาณ ${achievableYuca.toFixed(0)} ตัน แทน ${yucaEndStockTarget})`:` — ได้ตามเป้า ${yucaEndStockTarget} ตัน`}\n`;
  msg += `เชื้อเพลิงวันละ ${dailyFuel} ตัน${fuelClamped?` (ติดเพดานรับได้จริง — จะได้สต๊อกปลายเดือนประมาณ ${achievableFuel.toFixed(0)} ตัน แทน ${fuelEndStockTarget})`:` — ได้ตามเป้า ${fuelEndStockTarget} ตัน`}\n\n`;
  msg += `จะเติมแผน "รับเข้าจริง" วันที่ ${asOfDay+1} ถึง ${nd} ด้วยตัวเลขนี้ (เขียนทับของเดิมถ้ามี) ดำเนินการต่อไหม?`;

  if(!confirm(msg)) return;

  remainingDays.forEach(d=>{
    if(!procurementActual[d]) procurementActual[d] = {};
    procurementActual[d].yucaActualReceived = dailyYuca;
    procurementActual[d].fuelActualReceived = dailyFuel;
    markDirtyPurchase(d);
  });
  renderAll();

  purchaseCheckpoint.updatedAt = new Date().toISOString();
  purchaseCheckpoint.updatedBy = SESSION.username;
  try{
    await fetch(API_ENDPOINT, {
      method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({
        secret: API_SECRET, month: currentMonth, line:'PURCHASECFG', day:'checkpoint',
        runs: [{asOfDay, yucaStock: yucaStockNow, fuelStock: fuelStockNow, updatedAt: purchaseCheckpoint.updatedAt, updatedBy: SESSION.username}],
        updatedBy: SESSION.username,
      }),
    });
  }catch(err){ console.error('save purchase checkpoint error', err); }
};

function syncFloatingDayHeader(){
  let bar = document.getElementById('floatingDayHeader');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'floatingDayHeader';
    document.body.appendChild(bar);
  }

  // หาแถวหัววันที่ (dayheader) ที่กำลังแสดงอยู่จริงบนหน้าจอตอนนี้ (พรีวิวของแอดมิน หรือ ตารางของหัวหน้ากะ)
  const wraps = document.querySelectorAll('#main .tablewrap');
  let target = null;
  wraps.forEach(w=>{
    if(target) return;
    const row = w.querySelector('table.preview-table thead tr.dayheader, table.preview-table thead tr:first-child');
    if(row && w.offsetParent !== null) target = {wrap:w, row};
  });

  if(!target){ bar.style.display='none'; return; }

  const headerEl = document.querySelector('header');
  const headerH = headerEl ? headerEl.offsetHeight : 0;
  const rowRect = target.row.getBoundingClientRect();
  const wrapRect = target.wrap.getBoundingClientRect();

  // แสดง floating bar เฉพาะตอนที่แถวหัวจริงเลื่อนขึ้นไปเลยจุดที่ควรอยู่ (บังใต้เมนูบนสุด) และตารางยังอยู่ในจอ
  const shouldFloat = rowRect.top < headerH && wrapRect.bottom > headerH + 20;

  if(!shouldFloat){
    bar.style.display = 'none';
    return;
  }

  bar.style.display = 'block';
  bar.style.top = headerH + 'px';
  bar.style.left = wrapRect.left + 'px';
  bar.style.width = wrapRect.width + 'px';

  // โคลนแถวหัว แล้วบังคับความกว้างแต่ละช่องให้ตรงกับของจริงเป๊ะ ก่อนเลื่อนตาม scrollLeft ของตาราง
  bar.innerHTML = `<table><tbody><tr>${target.row.innerHTML}</tr></tbody></table>`;
  const realCells = target.row.children;
  const cloneRow = bar.querySelector('tr');
  for(let i=0; i<realCells.length; i++){
    const w = realCells[i].getBoundingClientRect().width;
    if(cloneRow.children[i]){
      cloneRow.children[i].style.width = w + 'px';
      cloneRow.children[i].style.minWidth = w + 'px';
      cloneRow.children[i].style.maxWidth = w + 'px';
    }
  }
  bar.querySelector('table').style.transform = `translateX(${-target.wrap.scrollLeft}px)`;
}
