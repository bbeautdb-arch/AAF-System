<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผนผลิตประจำวัน — AAF</title>
<style>
  :root{
    --bg:#12181b; --panel:#1a2226; --panel2:#202a2f; --ink:#e8edee; --sub:#93a3a8;
    --line1:#e8975a; --line1-soft:#3a2c1f;
    --line2:#5db3d6; --line2-soft:#1c2f38;
    --line3:#8bc48a; --line3-soft:#1f2f22;
    --amber:#f2c14e; --today:#33422f; --grid:#2a3438; --danger:#e06a5f; --ok:#5fbf7a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bai Jamjuree','Sarabun','TH Sarabun New','Segoe UI',sans-serif;}
  header{padding:18px 20px 14px;border-bottom:1px solid var(--grid);position:sticky;top:0;background:var(--bg);z-index:30;}
  header .top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  h1{font-size:1.3rem;margin:0;font-weight:700;}
  h1 small{display:block;font-weight:400;font-size:.76rem;color:var(--sub);margin-top:2px;}
  #clock{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--sub);}
  .userbar{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--sub);}
  .userbar b{color:var(--ink);}
  .badge{padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:700;}
  .badge.admin{background:#3a2c1f;color:var(--line1);}
  .badge.production{background:#1c2f38;color:var(--line2);}
  .badge.purchase_material{background:#1f2f22;color:var(--line3);}
  .btn{border:1px solid var(--grid);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;font-size:.82rem;cursor:pointer;font-weight:600;}
  .btn:hover{background:var(--panel2);}
  .btn.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff;}
  .btn.danger{background:transparent;border-color:var(--danger);color:var(--danger);padding:3px 9px;font-size:.75rem;}
  .toolbar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .toolbar input[type=month]{background:var(--panel);border:1px solid var(--grid);color:var(--ink);padding:7px 10px;border-radius:8px;font-size:.85rem;}
  .tabs{display:flex;gap:8px;}
  .tab{border:1px solid var(--grid);background:var(--panel);color:var(--ink);padding:8px 16px;border-radius:999px;font-size:.88rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;}
  .tab .dot{width:9px;height:9px;border-radius:50%;}
  .tab[data-line="Line 1"] .dot{background:var(--line1);} .tab[data-line="Line 2"] .dot{background:var(--line2);} .tab[data-line="Line 3"] .dot{background:var(--line3);}
  .tab.active{background:var(--panel2);border-color:currentColor;}
  .tab[data-line="Line 1"].active{color:var(--line1);} .tab[data-line="Line 2"].active{color:var(--line2);} .tab[data-line="Line 3"].active{color:var(--line3);}
  #syncstatus{font-size:.75rem;color:var(--sub);}
  #syncstatus.saving{color:var(--amber);}
  #syncstatus.ok{color:var(--ok);}
  #syncstatus.err{color:var(--danger);}

  main{padding:16px 20px 60px;}
  .linewrap{display:none;} .linewrap.active{display:block;}
  .scrollhint{color:var(--sub); font-size:.78rem; margin-bottom:8px;}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
  .card{background:var(--panel);border:1px solid var(--grid);border-radius:10px;padding:12px 14px;}
  .card .label{font-size:.7rem;color:var(--sub);text-transform:uppercase;letter-spacing:.03em;}
  .card .value{font-size:1.4rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;}
  .card .value span{font-size:.8rem;font-weight:500;color:var(--sub);}

  .daysrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;}
  .daycard{
    flex:0 0 auto; background:var(--panel); border:1px solid var(--grid); border-radius:12px;
    min-width:158px; overflow:hidden;
  }
  @keyframes today-pulse { 0%,100%{ box-shadow:0 0 0 1px var(--amber); } 50%{ box-shadow:0 0 0 3px var(--amber); } }
  th.today-col-header{ background:var(--today) !important; animation: today-pulse 1.6s ease-in-out infinite; }
  .daycard.today{border-color:var(--amber); animation: today-pulse 1.6s ease-in-out infinite;}
  .daycard .dayhead{
    background:var(--panel2); padding:8px 10px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--grid);
  }
  .daycard .dayhead .num{font-weight:800;font-size:1.05rem;}
  .daycard .dayhead .dow{color:var(--sub);font-size:.72rem;}
  .runcol{border-bottom:1px solid var(--grid); padding:8px 10px;}
  .runcol:last-child{border-bottom:none;}
  .runcol .rowline{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;font-size:.74rem;color:var(--sub);}
  select.thickness-sel, input.hr-input, input.note-input{
    width:100%; background:var(--panel2); border:1px solid var(--grid); color:var(--ink);
    padding:5px 7px; border-radius:6px; font-size:.82rem; margin-bottom:6px;
  }
  .calc-line{display:flex; justify-content:space-between; font-size:.78rem; padding:2px 0;}
  .calc-line .k{color:var(--sub);}
  .calc-line .v{font-variant-numeric:tabular-nums;font-weight:700;}
  .l1 .calc-line .v{color:var(--line1);} .l2 .calc-line .v{color:var(--line2);} .l3 .calc-line .v{color:var(--line3);}
  .emptyday{padding:16px 10px; text-align:center; color:var(--sub); font-size:.82rem;}
  .addrun-btn{
    width:100%; padding:8px; background:none; border:1px dashed var(--grid); color:var(--sub);
    border-radius:8px; cursor:pointer; font-size:.78rem; margin-top:4px;
  }
  .addrun-btn:hover{color:var(--ink); border-color:var(--sub);}
  .rm-btn{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.85rem;padding:0 4px;}

  footer{padding:16px 20px 40px;color:var(--sub);font-size:.78rem;border-top:1px solid var(--grid);margin-top:10px;}
  @media (max-width:640px){ h1{font-size:1.05rem;} }

  .pagenav{display:flex;gap:8px;}
  .pagebtn.active{background:var(--panel2);border-color:var(--ink);}

  .previewbox{background:var(--panel);border:1px solid var(--grid);border-radius:12px;padding:12px;margin-bottom:18px;}
  .previewhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .previewhead b{font-size:.95rem;}
  .tablewrap{overflow-x:auto;overflow-y:clip;border:1px solid var(--grid);border-radius:10px;}
  table.preview-table{border-collapse:collapse;font-size:.76rem;white-space:nowrap;}
  table.preview-table th, table.preview-table td{border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);padding:5px 8px;text-align:center;font-variant-numeric:tabular-nums;}
  table.preview-table thead th{background:#1e3350;color:#e8edee;z-index:1;border-bottom:2px solid #3d5a80;}
  #floatingDayHeader{position:fixed;overflow:hidden;z-index:50;display:none;background:#1e3350;border-bottom:2px solid #3d5a80;box-shadow:0 4px 10px rgba(0,0,0,0.4);}
  #floatingDayHeader table{border-collapse:collapse;}
  #floatingDayHeader th{padding:8px 10px;font-size:.78rem;color:#e8edee;white-space:nowrap;box-sizing:border-box;}
  table.preview-table th.rowlabel-corner{position:sticky;left:0;z-index:7;}
  table.preview-table tbody th{text-align:left;background:var(--panel2);color:var(--sub);position:sticky;left:0;z-index:2;white-space:nowrap;}
  table.preview-table tr.line-sep th{background:var(--panel2);font-weight:800;font-size:.82rem;text-align:left;position:sticky;left:0;padding-top:10px;padding-bottom:10px;border-top:3px solid var(--grid);}
  table.preview-table tr.line-sep.l1 th{color:var(--line1);border-top-color:var(--line1);}
  table.preview-table tr.line-sep.l2 th{color:var(--line2);border-top-color:var(--line2);}
  table.preview-table tr.line-sep.l3 th{color:var(--line3);border-top-color:var(--line3);}
  table.preview-table td.l1{color:var(--line1);} table.preview-table td.l2{color:var(--line2);} table.preview-table td.l3{color:var(--line3);}
  tr.bd-row td{padding:3px 8px;}
  .bd-size{font-size:.68rem;color:var(--sub);white-space:nowrap;}
  .bd-count{font-size:.78rem;font-weight:700;}
  .day-even{background:rgba(255,255,255,0.03);}
  td.day-start, th.day-start{border-left:3px solid #45575d;}
  td.day-end, th.day-end{border-right:3px solid #45575d;}
  .day-ctl{display:flex;gap:4px;justify-content:center;margin-top:4px;}
  thead .pv-add-btn, thead .pv-rm-btn{width:18px;height:18px;font-size:.72rem;}
  input.pv-input{
    width:56px; background:var(--panel2); border:1px solid var(--grid); color:var(--ink);
    padding:3px 4px; border-radius:5px; font-size:.76rem; text-align:center; font-variant-numeric:tabular-nums;
  }
  @keyframes blink-warn { 0%,100%{ box-shadow: 0 0 0 2px var(--danger); } 50%{ box-shadow: 0 0 0 2px transparent; } }
  input.not-std, td.not-std, div.not-std{ animation: blink-warn 1s infinite; }
  input.stock-override{border-color:var(--danger) !important; color:var(--danger) !important; background:rgba(224,106,95,0.12) !important;}
  input.pv-note{width:90px; text-align:left;}
  tr.addrow td{background:var(--panel2);}
  .pv-add-btn, .pv-rm-btn{
    border:1px solid var(--grid); background:var(--panel); color:var(--ink);
    width:22px; height:22px; border-radius:5px; cursor:pointer; font-weight:800; font-size:.85rem; line-height:1;
  }
  .pv-add-btn:hover{background:var(--ok); color:#0d1117; border-color:var(--ok);}
  .pv-rm-btn{margin-left:4px;}
  .pv-rm-btn:hover{background:var(--danger); color:#0d1117; border-color:var(--danger);}

  table.std-table{border-collapse:collapse;width:100%;max-width:520px;}
  table.std-table th, table.std-table td{border-bottom:1px solid var(--grid);padding:8px 12px;text-align:center;}
  table.std-table thead th{background:var(--panel2);color:var(--sub);font-size:.78rem;}
  table.std-table td.thk{text-align:left;font-weight:700;background:var(--panel2);}
  table.std-table th.l1, table.std-table td.l1{color:var(--line1);} table.std-table th.l2, table.std-table td.l2{color:var(--line2);} table.std-table th.l3, table.std-table td.l3{color:var(--line3);}
  input.std-input{width:70px;background:var(--panel2);border:1px solid var(--grid);color:var(--ink);padding:5px 6px;border-radius:6px;text-align:center;font-variant-numeric:tabular-nums;}
  table.size-table{width:auto;}
  input.size-name-input{width:120px;text-align:left;}
  input.size-wl-input{width:56px;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header>
  <div class="top">
    <h1>แผนผลิตประจำวัน <small>AAF · Advance Asia Fiber — ระบบแผนผลิตและมาตรฐานโรงงาน</small></h1>
    <div style="display:flex;align-items:center;gap:16px;">
      <div class="userbar" id="userbar"></div>
      <div id="clock"></div>
    </div>
  </div>
  <div class="toolbar">
    <div class="pagenav" id="pagenav">
      <button class="btn pagebtn active" data-page="entry">แผนผลิตรายวัน</button>
      <button class="btn pagebtn" data-page="std">มาตรฐาน</button>
      <button class="btn pagebtn" data-page="eff">ประเมิน Eff</button>
      <button class="btn pagebtn" data-page="purchase" id="purchaseNavBtn" style="display:none;">จัดซื้อวัตถุดิบ</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <input type="month" id="monthPicker">
    <span id="revBadge" style="font-size:.78rem;color:var(--amber);font-weight:700;"></span>
    <span id="syncstatus"></span>
    <span style="flex:1"></span>
    <button class="btn" id="backBtn" style="display:none">← ระบบขาย</button>
    <button class="btn" id="saveBtn" style="display:none">💾 บันทึกข้อมูล</button>
    <button class="btn" id="logoutBtn">ออกจากระบบ</button>
  </div>
</header>

<main id="main"></main>

<footer>
  เป้าแผ่นผลิต คำนวณอัตโนมัติจาก: STD P/hr (ตามความหนา+Line) × ชม.ผลิต × จำนวน "แผ่นที่" ของขนาดที่เลือก × จำนวนชั้นของ Line · ข้อมูลซิงค์ผ่าน Google Sheet แบบเรียลไทม์
</footer>

<script>

const DENSITY_DEFAULT = {

const YUCA_SUPPLIER_NAMES = ["อีโค่ กรีนทรี จำกัด_EGT", "สวนป่าสุรสิทธิ์ จำกัด", "เฉลิมขวัญ ศรีษะนาราช", "แสงเดือน บังเกิดจังหรีด", "สุพจน์ บานกระโทก", "สรสิช จรจันทร์", "ธนกุล กรุยกระโทก", "สมภาร บุญกระโทก", "ประเทือง ไลกระโทก", "สุดารัตน์ พึ่งครบุรี", "สุราช อันพิมพา", "กันยา ศรีระมาตร", "แจง ดงกระโทก", "บุญมี กาวกระโทก", "ปฐมพร พริ้งเพราะ", "ศักรินทร์ วอนอก", "ประวิทย์ บุตรเพชร", "สมศักดิ์ มืดอินทร์", "ทติยาวรรณ รุมพล", "พรนภา ปลอดกระโทก", "สุระพล ผัดกระโทก", "หอม จรครบุรี", "พิกุล กาบกระโทก", "ฐปนรรฆ์ ชาญนอก", "ลม้าย แนบกระโทก", "เดช รวยสันเทียะ", "นรีรัตน์ ถนอมพลกรัง", "เกรียงไกร วิชัยรัมย์", "กฤษณะ พรมแก้ว", "จำรัส เพราะกระโทก", "อุมาพร เชาว์จอหอ", "ศักดิ์ชัย หงษ์สมศรี", "เดือน กรกระโทก", "ประทีป กันหมื่นไวย์", "อุทัย แคกระโทก", "ประสงค์ มินดอน", "ปวีณ์นุช ศรีลำใต้", "สายชล พงษ์สา", "คมสัน ปรายกระโทก", "จุลาภรณ์ เล็กประโคน"];

function sheetsPerTonRawBoard(line){
  const spec = rawBoardConfig[line] || {w:1.26, l:4.97, density:910};
  const weightPerStdSheetEquiv = (spec.w * spec.l * (STD_THICKNESS/1000) * spec.density) / 2;
  return weightPerStdSheetEquiv > 0 ? 1000 / weightPerStdSheetEquiv : 0;
}

// สาย 1: น้ำหนักไม้จริงจากความหนา+ขนาดจริงที่ผลิต × ยิวคำนวณ (ตัวมาตรฐาน)
function calcWoodTonsStandard(line, run){
  if(!run.thickness) return 0;
  const density = getDensity(run.thickness);
  const breakdown = calcRunSizeBreakdown(line, run);
  let weightKg = 0;
  breakdown.forEach(item=>{
    const w = Number(item.w)||0, l = Number(item.l)||0;
    weightKg += w * l * (run.thickness/1000) * density * item.count;
  });
  return (weightKg/1000) * yieldCalcConst;
}

// สาย 2: แปลงเป็นหน่วยมาตรฐาน 2.5mm/1220x2440 ก่อน (ทั้งขนาดและความหนา) แล้วหารแผ่นต่อตันแบบ Raw Board (รายไลน์) × ยิว Target (ตัวควบคุม)
function calcWoodTonsTarget(line, run){
  if(!run.thickness) return 0;
  const STD_AREA_M2 = 1.22 * 2.44;
  const breakdown = calcRunSizeBreakdown(line, run);
  let stdEquivBoards = 0;
  breakdown.forEach(item=>{
    const areaM2 = (Number(item.w)||0) * (Number(item.l)||0);
    stdEquivBoards += item.count * (areaM2/STD_AREA_M2) * (run.thickness/STD_THICKNESS);
  });
  const perTon = sheetsPerTonRawBoard(line);
  const tonsRaw = perTon > 0 ? stdEquivBoards / perTon : 0;
  return tonsRaw * yieldTargetConst;
}

  if(yieldOverrides[t]!=null && yieldOverrides[t]!=='') return Number(yieldOverrides[t]);

}

// น้ำหนัก FG ต่อแผ่น (kg) — D = m/v โดย v = กว้าง(ม.) × ยาว(ม.) × ความหนา(ม.) ขนาดมาตรฐาน 1220x2440
function getFgWeightPerSheet(thickness){
  const density = getDensity(thickness);
  const t = Number(thickness);
  const volumeM3 = 1.22 * 2.44 * (t/1000);
  return density * volumeM3;
}

// จำนวนแผ่นต่อ 1 ตัน FG (ปัดเศษใกล้เคียงสุด)
function getSheetsPerTon(thickness){
  const w = getFgWeightPerSheet(thickness);
  return w > 0 ? Math.round(1000 / w) : 0;
}

function daysInMonth(ym){
  const [y,m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function numPlain(v, digits){
  const n = Number(v);
  if(!Number.isFinite(n)) return '';
  digits = digits===undefined?2:digits;
  return n.toFixed(digits).replace(/\.0+$/,'').replace(/(\.\d*[1-9])0+$/,'$1');
}
function safeNum(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}
function num(v, digits){
  if(v===null||v===undefined||Number.isNaN(Number(v))) return '—';
  digits = digits===undefined?2:digits;
  let s = Number(v).toFixed(digits).replace(/\.0+$/,'').replace(/(\.\d*[1-9])0+$/,'$1');
  let parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
  return parts.join('.');
}
function getSizeSheets(sizeName){
  if(!sizeName) return [];
  const trimmed = String(sizeName).trim();
  for(const rid of Object.keys(sizeStdRows)){
    const row = sizeStdRows[rid];
    if(row && row.name && row.name.trim() === trimmed){
      return (row.sheets||[]).filter(s => s && Number(s.w) > 0 && Number(s.l) > 0);
    }
  }
  return [];
}

function calcRun(line, run){
  const stdphr = getStdPhr(run.thickness, line);
  const hours = Number(run.hours)||0;
  // หมายเหตุ: แผนหลักไม่หัก Eff — ใส่เต็มจำนวนปกติเสมอ Eff ใช้เฉพาะในหน้า "ประเมิน Eff" เท่านั้น
  const presses = stdphr * hours;
  const sheets = getSizeSheets(run.size);
  const layers = LAYERS[line] || 0;
  const boards = presses * sheets.length * layers;
  return {stdphr, presses, boards, sheets, layers};
}

function calcRunSizeBreakdown(line, run){
  const c = calcRun(line, run);
  const perSlotCount = c.presses * c.layers;
  const groups = {};
  c.sheets.forEach(s=>{
    const key = `${s.w}x${s.l}`;
    if(!groups[key]) groups[key] = {w:s.w, l:s.l, count:0};
    groups[key].count += perSlotCount;
  });
  return Object.values(groups);
}

function setSyncStatus(state, msg){
  const el = document.getElementById('syncstatus');
  el.className = state;
  el.textContent = msg || (state==='saving'?'กำลังบันทึก...':state==='ok'?'บันทึกแล้ว':state==='err'?'บันทึกไม่สำเร็จ':'');
}

async function loadMonth(ym){
  setSyncStatus('saving','กำลังโหลดข้อมูล...');
  currentRev = 0;
  revBumpedForMonth = null;
  effEvalValues = {'Line 1': EFF['Line 1']*100, 'Line 2': EFF['Line 2']*100, 'Line 3': EFF['Line 3']*100};
  materialData = {};
  procurementActual = {};
  purchaseCheckpoint = {};
  supplierEntries = {};
  otherMaterialActual = {};
  try{
    const res = await fetch(`${API_ENDPOINT}?action=load&month=${ym}`);
    const json = await res.json();
    planData = {};
    if(json.ok){
      Object.keys(json.data).forEach(key=>{
        // key = YYYY-MM_Line X_day  (or YYYY-MM_META_rev for revision counter, YYYY-MM_EFFCFG_Line X for Eff%, YYYY-MM_MATERIAL_day for วัตถุดิบ)
        const parts = key.split('_');
        const day = parts[parts.length-1];
        const line = parts.slice(1,-1).join('_');
        if(line === 'META' && day === 'rev'){
          const runs = json.data[key];
          currentRev = (runs && runs[0] && runs[0].count) ? Number(runs[0].count) : 0;
          return;
        }
        if(line === 'EFFCFG'){
          const runs = json.data[key];
          const pct = (runs && runs[0] && runs[0].pct!=null) ? Number(runs[0].pct) : null;
          if(pct!==null) effEvalValues[day] = pct; // day ในที่นี้คือชื่อ Line เช่น "Line 1"
          return;
        }
        if(line === 'MATERIAL'){
          const runs = json.data[key];
          const m = (runs && runs[0]) ? runs[0] : null;
          if(m) materialData[day] = {yucaReceived:m.yucaReceived, fuelUsed:m.fuelUsed, fuelReceived:m.fuelReceived,
                                       yucaStockOverride:m.yucaStockOverride, fuelStockOverride:m.fuelStockOverride};
          return;
        }
        if(line === 'PURCHASE'){
          const runs = json.data[key];
          const p = (runs && runs[0]) ? runs[0] : null;
          if(p) procurementActual[day] = {yucaActualReceived:p.yucaActualReceived, yucaActualPrice:p.yucaActualPrice,
                                            fuelActualReceived:p.fuelActualReceived, fuelActualPrice:p.fuelActualPrice,
                                            yucaActualUsed:p.yucaActualUsed, fuelActualUsed:p.fuelActualUsed,
                                            yucaActualStockOverride:p.yucaActualStockOverride, fuelActualStockOverride:p.fuelActualStockOverride};
          return;
        }
        if(line === 'PURCHASECFG' && day === 'checkpoint'){
          const runs = json.data[key];
          const cp = (runs && runs[0]) ? runs[0] : null;
          if(cp) purchaseCheckpoint = {asOfDay:cp.asOfDay, yucaStock:cp.yucaStock, fuelStock:cp.fuelStock, updatedAt:cp.updatedAt, updatedBy:cp.updatedBy};
          return;
        }
        if(line === 'SUPPLIER'){
          const runs = json.data[key];
          const s = (runs && runs[0]) ? runs[0] : null;
          if(s) supplierEntries[day] = {yuca: s.yuca||[], fuel: s.fuel||[]};
          return;
        }
        if(line === 'OTHERMAT'){
          const runs = json.data[key];
          const om = (runs && runs[0]) ? runs[0] : null;
          if(om) otherMaterialActual[day] = om.data || {};
          return;
        }
        planData[`${line}_${day}`] = json.data[key] || [];
      });
    }
    setSyncStatus('ok','โหลดข้อมูลล่าสุดแล้ว');
  }catch(err){
    setSyncStatus('err','โหลดข้อมูลไม่สำเร็จ — ตรวจสอบการเชื่อมต่อ API');
    console.error(err);
  }
  updateRevBadge();
  renderAll();
}

function updateRevBadge(){
  const el = document.getElementById('revBadge');
  if(!el) return;
  const [y,m] = currentMonth.split('-');
  const yy = y.slice(2);
  el.textContent = currentRev > 0 ? `${m}-${yy} Rev.${String(currentRev).padStart(2,'0')}` : `${m}-${yy} (ยังไม่มีการแก้ไข)`;
}

async function bumpRevision(ym){
  currentRev += 1;
  updateRevBadge();
  try{
    await fetch(API_ENDPOINT, {
      method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({
        secret: API_SECRET, month: ym, line: 'META', day: 'rev',
        runs: [{count: currentRev}], updatedBy: SESSION.username,
      }),
    });
  }catch(err){ console.error('bumpRevision error', err); }
}

let dirtyStd = new Set();   // keys `${thickness}||${line}`

let dirtyEff = new Set(); // ชื่อ Line ที่แก้ % Eff แล้ว

let dirtyDensity = new Set(); // ความหนาที่แก้ Density แล้ว
let dirtyYield = new Set(); // ความหนาที่แก้ยิวการใช้ไม้แล้ว
let dirtyWoodCfg = new Set(); // 'consts' และ/หรือชื่อ Line ที่แก้ raw board แล้ว

let dirtyPurchase = new Set(); // วันที่ที่จัดซื้อกรอกผลจริงแล้ว
let dirtySupplier = new Set(); // วันที่ที่แก้รายการซัพพลายเออร์แล้ว
let dirtyOtherMat = new Set(); // วันที่ที่มีข้อมูลไม้/เชื้อเพลิงประเภทอื่นใหม่

function markDirtyDay(line, day){ dirtyDays.add(`${line}_${day}`); updateDirtyIndicator(); }
function markDirtyStd(thickness, line){ dirtyStd.add(`${thickness}||${line}`); updateDirtyIndicator(); }
function markDirtyGrade(){ dirtyGrade.add('global'); updateDirtyIndicator(); }
function markDirtyDensity(thickness){ dirtyDensity.add(thickness); updateDirtyIndicator(); }
function markDirtyYield(thickness){ dirtyYield.add(thickness); updateDirtyIndicator(); }
function markDirtyWoodCfg(key){ dirtyWoodCfg.add(key); updateDirtyIndicator(); }
function markDirtyMaterial(day){ dirtyMaterial.add(day); updateDirtyIndicator(); }
function markDirtyPurchase(day){ dirtyPurchase.add(day); updateDirtyIndicator(); }
function markDirtySupplier(day){ dirtySupplier.add(day); updateDirtyIndicator(); }
function markDirtyOtherMat(day){ dirtyOtherMat.add(day); updateDirtyIndicator(); }
function markDirtySizeRow(rowId){ dirtySizeRows.add(rowId); updateDirtyIndicator(); }
function markDirtyEff(line){ dirtyEff.add(line); updateDirtyIndicator(); }

function updateDirtyIndicator(){
  const el = document.getElementById('syncstatus');
  const btn = document.getElementById('saveBtn');
  const n = dirtyDays.size + dirtyStd.size + dirtySizeRows.size + dirtyEff.size + dirtyGrade.size + dirtyDensity.size + dirtyYield.size + dirtyWoodCfg.size + dirtyMaterial.size + dirtyPurchase.size + dirtySupplier.size + dirtyOtherMat.size;
  if(!el) return;
  if(n > 0){
    el.className = 'saving';
    el.textContent = `มีการแก้ไข ${n} รายการที่ยังไม่บันทึก`;
    if(btn) btn.classList.add('primary');
  } else {
    el.className = 'ok';
    el.textContent = 'บันทึกล่าสุดแล้ว';
    if(btn) btn.classList.remove('primary');
  }
}

async function saveAllChanges(){
  if(!IS_ADMIN && !IS_PURCHASE) return;
  const btn = document.getElementById('saveBtn');
  const total = dirtyDays.size + dirtyStd.size + dirtySizeRows.size + dirtyEff.size + dirtyGrade.size + dirtyDensity.size + dirtyYield.size + dirtyWoodCfg.size + dirtyMaterial.size + dirtyPurchase.size + dirtySupplier.size + dirtyOtherMat.size;
  if(total === 0){
    setSyncStatus('ok', 'ไม่มีการเปลี่ยนแปลงที่ต้องบันทึก');
    return;
  }
  btn.disabled = true;
  let done = 0;
  setSyncStatus('saving', `กำลังบันทึก... (0/${total})`);

  for(const key of Array.from(dirtyDays)){
    const us = key.lastIndexOf('_');
    const line = key.slice(0, us);
    const day = key.slice(us+1);
    try{
      await fetch(API_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          secret: API_SECRET, month: currentMonth, line, day,
          runs: planData[key] || [], updatedBy: SESSION.username,
        }),
      });
      dirtyDays.delete(key);
    }catch(err){ console.error('save day error', key, err); }
    done++;
    setSyncStatus('saving', `กำลังบันทึก... (${done}/${total})`);
  }

  for(const key of Array.from(dirtyStd)){
    const [thickness, line] = key.split('||');
    const value = (STD_OVERRIDES[thickness] && STD_OVERRIDES[thickness][line]!=null) ? STD_OVERRIDES[thickness][line] : null;
    try{
      await fetch(API_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          secret: API_SECRET, month:'STD', line, day: thickness,
          runs: [{value}], updatedBy: SESSION.username,
        }),
      });
      dirtyStd.delete(key);
    }catch(err){ console.error('save std error', key, err); }
    done++;
    setSyncStatus('saving', `กำลังบันทึก... (${done}/${total})`);
  }

  for(const rowId of Array.from(dirtySizeRows)){
    const row = sizeStdRows[rowId];
    const runs = row ? [{name: row.name, sheets: row.sheets}] : [];
    try{
      await fetch(API_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          secret: API_SECRET, month:'SIZESTD', line:'row', day: rowId,
          runs, updatedBy: SESSION.username,
        }),
      });
      dirtySizeRows.delete(rowId);
      if(!row) delete sizeStdRows[rowId];
    }catch(err){ console.error('save size row error', rowId, err); }
    done++;
    setSyncStatus('saving', `กำลังบันทึก... (${done}/${total})`);
  }

  for(const line of Array.from(dirtyEff)){
    const pct = effEvalValues[line];
    try{
      await fetch(API_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          secret: API_SECRET, month: currentMonth, line:'EFFCFG', day: line,
          runs: [{pct}], updatedBy: SESSION.username,
        }),
      });
      dirtyEff.delete(line);
    }catch(err){ console.error('save eff error', line, err); }
    done++;
    setSyncStatus('saving', `กำลังบันทึก... (${done}/${total})`);
  }

  for(const marker of Array.from(dirtyGrade)){
    try{
      await fetch(API_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          secret: API_SECRET, month:'GRADECFG', line:'global', day:'pct',
          runs: [{b:gradePct.b??null, f:gradePct.f??null, rej:gradePct.rej??null}], updatedBy: SESSION.username,
        }),
      });
      dirtyGrade.delete(marker);
    }catch(err){ console.error('save grade error', err); }
    done++;
    setSyncStatus('saving', `กำลังบันทึก... (${done}/${total})`);
  }

  for(const thickness of Array.from(dirtyDensity)){
    const val = densityOverrides[thickness];
    try{
      await fetch(API_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          secret: API_SECRET, month:'DENSITYCFG', line:'row', day: thickness,
          runs: [{value: val??null}], updatedBy: SESSION.username,
        }),
      });
      dirtyDensity.delete(thickness);
    }catch(err){ console.error('save density error', thickness, err); }
    done++;
    setSyncStatus('saving', `กำลังบันทึก... (${done}/${total})`);
  }

  for(const thickness of Array.from(dirtyYield)){
    const val = yieldOverrides[thickness];
    try{
      await fetch(API_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          secret: API_SECRET, month:'YIELDCFG', line:'row', day: thickness,
          runs: [{value: val??null}], updatedBy: SESSION.username,
        }),
      });
      dirtyYield.delete(thickness);
    }catch(err){ console.error('save yield error', thickness, err); }
    done++;
    setSyncStatus('saving', `กำลังบันทึก... (${done}/${total})`);
  }

  for(const key of Array.from(dirtyWoodCfg)){
    try{
      if(key === 'consts'){
        await fetch(API_ENDPOINT, {
          method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({
            secret: API_SECRET, month:'WOODCFG', line:'global', day:'consts',
            runs: [{yieldCalc: yieldCalcConst, yieldTarget: yieldTargetConst, steamRate: steamRatePerTonFG, fuelRate: fuelRatePerTonSteam,
                    yucaPrice, fuelPrice, yucaStockTarget, fuelStockTarget, yucaEndStockTarget, fuelEndStockTarget,
                    yucaDailyMin, yucaDailyMax, fuelDailyMin, fuelDailyMax}], updatedBy: SESSION.username,
          }),
        });
      } else {
        // key = ชื่อ Line
        const spec = rawBoardConfig[key];
        await fetch(API_ENDPOINT, {
          method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
          body: JSON.stringify({
            secret: API_SECRET, month:'WOODCFG', line:'rawboard', day: key,
            runs: [{w:spec.w, l:spec.l, density:spec.density}], updatedBy: SESSION.username,
          }),
        });
      }
      dirtyWoodCfg.delete(key);
    }catch(err){ console.error('save wood cfg error', key, err); }
    done++;
    setSyncStatus('saving', `กำลังบันทึก... (${done}/${total})`);
  }

  for(const day of Array.from(dirtyMaterial)){
    const m = materialData[day] || {};
    try{
      await fetch(API_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          secret: API_SECRET, month: currentMonth, line:'MATERIAL', day,
          runs: [{yucaReceived:m.yucaReceived??null, fuelUsed:m.fuelUsed??null, fuelReceived:m.fuelReceived??null,
                  yucaStockOverride:m.yucaStockOverride??null, fuelStockOverride:m.fuelStockOverride??null}],
          updatedBy: SESSION.username,
        }),
      });
      dirtyMaterial.delete(day);
    }catch(err){ console.error('save material error', day, err); }
    done++;
    setSyncStatus('saving', `กำลังบันทึก... (${done}/${total})`);
  }

  for(const day of Array.from(dirtyPurchase)){
    const p = procurementActual[day] || {};
    try{
      await fetch(API_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          secret: API_SECRET, month: currentMonth, line:'PURCHASE', day,
          runs: [{yucaActualReceived:p.yucaActualReceived??null, yucaActualPrice:p.yucaActualPrice??null,
                  fuelActualReceived:p.fuelActualReceived??null, fuelActualPrice:p.fuelActualPrice??null,
                  yucaActualUsed:p.yucaActualUsed??null, fuelActualUsed:p.fuelActualUsed??null,
                  yucaActualStockOverride:p.yucaActualStockOverride??null, fuelActualStockOverride:p.fuelActualStockOverride??null}],
          updatedBy: SESSION.username,
        }),
      });
      dirtyPurchase.delete(day);
    }catch(err){ console.error('save purchase error', day, err); }
    done++;
    setSyncStatus('saving', `กำลังบันทึก... (${done}/${total})`);
  }

  for(const day of Array.from(dirtySupplier)){
    const s = supplierEntries[day] || {yuca:[], fuel:[]};
    try{
      await fetch(API_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          secret: API_SECRET, month: currentMonth, line:'SUPPLIER', day,
          runs: [{yuca: s.yuca||[], fuel: s.fuel||[]}],
          updatedBy: SESSION.username,
        }),
      });
      dirtySupplier.delete(day);
    }catch(err){ console.error('save supplier error', day, err); }
    done++;
    setSyncStatus('saving', `กำลังบันทึก... (${done}/${total})`);
  }

  for(const day of Array.from(dirtyOtherMat)){
    const om = otherMaterialActual[day] || {};
    try{
      await fetch(API_ENDPOINT, {
        method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          secret: API_SECRET, month: currentMonth, line:'OTHERMAT', day,
          runs: [{data: om}],
          updatedBy: SESSION.username,
        }),
      });
      dirtyOtherMat.delete(day);
    }catch(err){ console.error('save other material error', day, err); }
    done++;
    setSyncStatus('saving', `กำลังบันทึก... (${done}/${total})`);
  }

  if(IS_ADMIN && revBumpedForMonth !== currentMonth){
    revBumpedForMonth = currentMonth;
    await bumpRevision(currentMonth);
  }

  btn.disabled = false;
  updateDirtyIndicator();
  alert('บันทึกข้อมูลเรียบร้อยแล้ว');
}

/* ============== RENDER ============== */
function dowForDay(ym, dayNum){
  const [y,m] = ym.split('-').map(Number);
  return DOW[new Date(y, m-1, dayNum).getDay()];
}

function thicknessOptions(selected){
  let html = `<option value="">—เลือก—</option>`;
  THICKNESS_LIST.forEach(t=>{
    html += `<option value="${t}" ${Number(selected)===t?'selected':''}>${t}</option>`;
  });
  return html;
}

function isValidThickness(t){
  if(t===null || t===undefined || t==='') return true; // ยังไม่กรอก ยังไม่ต้องเตือน
  return THICKNESS_LIST.includes(Number(t));
}

function isValidSizeName(name){
  if(!name) return true; // ยังไม่กรอก ถือว่ายังไม่ต้องเตือน
  if(!sizeConfigLoaded) return true; // ข้อมูลมาตรฐานขนาดยังโหลดไม่เสร็จ อย่าเพิ่งเตือนผิดๆ
  const trimmed = String(name).trim();
  return Object.keys(sizeStdRows).some(rid=>{
    const row = sizeStdRows[rid];
    return row && row.name && row.name.trim() === trimmed;
  });
}

function thicknessDatalist(){
  let html = `<datalist id="thicknessList">`;
  THICKNESS_LIST.forEach(t=>{ html += `<option value="${t}">`; });
  html += `</datalist>`;
  return html;
}

function sizeDatalist(){
  let html = `<datalist id="sizeList">`;
  Object.keys(sizeStdRows).forEach(rid=>{
    const row = sizeStdRows[rid];
    if(row && row.name) html += `<option value="${row.name}">`;
  });
  html += `</datalist>`;
  return html;
}

function buildDayCard(line, ym, dayNum, isToday){
  const key = `${line}_${dayNum}`;
  const runs = planData[key] || [];
  const cls = LINE_CLASS[line];
  let html = `<div class="daycard ${isToday?'today':''}" data-key="${key}">
    <div class="dayhead"><span class="num">${dayNum}</span><span class="dow">${dowForDay(ym,dayNum)}</span></div>`;

  if(runs.length===0){
    html += `<div class="emptyday ${cls}">ไม่มีแผน</div>`;
  } else {
    runs.forEach((run, ri)=>{
      const c = calcRun(line, run);
      const breakdown = calcRunSizeBreakdown(line, run);
      html += `<div class="runcol ${cls}" data-idx="${ri}">`;
      if(IS_ADMIN){
        html += `<div class="rowline"><span>รอบที่ ${ri+1}</span><button class="rm-btn" onclick="removeRun('${line}',${dayNum},${ri})">ลบ ✕</button></div>
          <input class="thickness-sel${!isValidThickness(run.thickness)?' not-std':''}" type="text" list="thicknessList" placeholder="ความหนา" value="${run.thickness!==undefined&&run.thickness!==null&&run.thickness!==''?run.thickness:''}" onchange="updateRun('${line}',${dayNum},${ri},'thickness',this.value)">
          <input class="thickness-sel${run.size && !isValidSizeName(run.size)?' not-std':''}" type="text" list="sizeList" placeholder="ขนาด (พิมพ์/วางได้)" value="${run.size||''}" onchange="updateRun('${line}',${dayNum},${ri},'size',this.value)">
          <input class="hr-input" type="number" min="0" step="0.5" placeholder="ชม.ผลิต" value="${run.hours||''}" onchange="updateRun('${line}',${dayNum},${ri},'hours',this.value)">
          <input class="note-input" type="text" placeholder="หมายเหตุ" value="${run.note||''}" onchange="updateRun('${line}',${dayNum},${ri},'note',this.value)">`;
      } else {
        const sizeName = run.size || '—';
        html += `<div class="rowline"><span>รอบที่ ${ri+1}</span><span>${run.thickness?run.thickness+' mm.':'—'} · ${sizeName}</span></div>`;
      }
      const stdMissing = run.thickness && c.stdphr===0;
      html += `<div class="calc-line${stdMissing?' not-std':''}"><span class="k">P/hr STD</span><span class="v">${num(c.stdphr,1)}</span></div>
        <div class="calc-line"><span class="k">จำนวนเพรส</span><span class="v">${num(c.presses,1)}</span></div>
        <div class="calc-line"><span class="k">เป้าแผ่นผลิต</span><span class="v">${num(c.boards,0)}</span></div>`;
      breakdown.forEach(g=>{
        html += `<div class="calc-line" style="font-size:.72rem;"><span class="k">↳ ${g.w}×${g.l} m.</span><span class="v">${num(g.count,0)}</span></div>`;
      });
      if(!IS_ADMIN && run.note){
        html += `<div class="calc-line" style="color:var(--amber)"><span class="k">หมายเหตุ</span><span class="v">${run.note}</span></div>`;
      }
      html += `</div>`;
    });
  }
  if(IS_ADMIN){
    html += `<button class="addrun-btn" onclick="addRun('${line}',${dayNum})">+ เพิ่มรอบ</button>`;
  }
  html += `</div>`;
  return html;
}

function buildLine(line){
  const ym = currentMonth;
  const nd = daysInMonth(ym);
  const todayStr = new Date().toISOString().slice(0,10);
  const todayDay = todayStr.slice(0,7)===ym ? Number(todayStr.slice(8,10)) : -1;

  let totalTarget=0, totalHours=0, thicknessSet=new Set();
  for(let d=1; d<=nd; d++){
    const runs = planData[`${line}_${d}`] || [];
    runs.forEach(r=>{
      const c = calcRun(line, r);
      totalTarget += c.boards;
      totalHours += Number(r.hours)||0;
      if(r.thickness) thicknessSet.add(r.thickness);
    });
  }
  const activeDaysEquiv = totalHours/24;

  let html = `<div class="summary">
    <div class="card"><div class="label">รวมเป้าเดือนนี้</div><div class="value">${num(totalTarget,0)} <span>แผ่น 4x8</span></div></div>
    <div class="card"><div class="label">วันเดินเครื่อง</div><div class="value">${num(activeDaysEquiv,1)} <span>/ ${nd} วัน</span></div></div>
    <div class="card"><div class="label">ความหนาที่ใช้เดือนนี้</div><div class="value" style="font-size:1rem;">${[...thicknessSet].sort((a,b)=>a-b).join(', ')||'—'} <span>mm.</span></div></div>
  </div>`;

  html += `<div class="daysrow">`;
  for(let d=1; d<=nd; d++){
    html += buildDayCard(line, ym, d, d===todayDay);
  }
  html += `</div>`;
  return html;
}

function buildLineRows(line, dayRunsCount, totalCols, nd){
  const cls = LINE_CLASS[line];
  function slotClasses(cls, d, i, cols){
    const zebra = d%2===0 ? 'day-even' : '';
    const start = i===0 ? 'day-start' : '';
    const end = i===cols-1 ? 'day-end' : '';
    return `${cls} ${zebra} ${start} ${end}`.trim();
  }
  let html = '';
  html += `<tr class="line-sep ${cls}"><th colspan="${totalCols}">${line}</th></tr>`;

  // ความหนา (แก้ไขได้)
  html += `<tr><th>ความหนา</th>`;
  for(let d=1; d<=nd; d++){
    const runs = planData[`${line}_${d}`] || [];
    const cols = dayRunsCount[d-1];
    for(let i=0; i<cols; i++){
      const run = runs[i];
      const tdCls = slotClasses(cls, d, i, cols);
      if(IS_ADMIN){
        const v = run && run.thickness!==null && run.thickness!==undefined ? run.thickness : '';
        html += `<td class="${tdCls}"><input type="text" list="thicknessList" class="pv-input pv-thk${!isValidThickness(v)?' not-std':''}" value="${v}"
          onchange="updateRun('${line}',${d},${i},'thickness',this.value)"></td>`;
      } else {
        const v = run && run.thickness ? run.thickness : '—';
        html += `<td class="${tdCls}">${v}</td>`;
      }
    }
  }
  html += `</tr>`;

  // ขนาด (แก้ไขได้)
  html += `<tr><th>ขนาด</th>`;
  for(let d=1; d<=nd; d++){
    const runs = planData[`${line}_${d}`] || [];
    const cols = dayRunsCount[d-1];
    for(let i=0; i<cols; i++){
      const run = runs[i];
      const tdCls = slotClasses(cls, d, i, cols);
      if(IS_ADMIN){
        html += `<td class="${tdCls}"><input type="text" list="sizeList" class="pv-input pv-size${run && run.size && !isValidSizeName(run.size) ? ' not-std' : ''}" style="width:80px;" value="${run ? (run.size||'') : ''}"
          onchange="updateRun('${line}',${d},${i},'size',this.value)"></td>`;
      } else {
        const sizeName = (run && run.size) ? run.size : '—';
        html += `<td class="${tdCls}">${sizeName}</td>`;
      }
    }
  }
  html += `</tr>`;

  // เป้าแผ่นผลิต (คำนวณอัตโนมัติ)
  html += `<tr><th>เป้าแผ่นผลิต</th>`;
  const breakdownCache = {};
  let maxBreakdown = 0;
  for(let d=1; d<=nd; d++){
    const runs = planData[`${line}_${d}`] || [];
    const cols = dayRunsCount[d-1];
    for(let i=0; i<cols; i++){
      const run = runs[i];
      const tdCls = slotClasses(cls, d, i, cols);
      const val = run ? num(calcRun(line, run).boards, 0) : '—';
      html += `<td class="${tdCls}">${val}</td>`;
      const bd = run ? calcRunSizeBreakdown(line, run) : [];
      breakdownCache[`${d}_${i}`] = bd;
      if(bd.length > maxBreakdown) maxBreakdown = bd.length;
    }
  }
  html += `</tr>`;

  for(let j=0; j<maxBreakdown; j++){
    html += `<tr class="bd-row"><th></th>`;
    for(let d=1; d<=nd; d++){
      const cols = dayRunsCount[d-1];
      for(let i=0; i<cols; i++){
        const tdCls = slotClasses(cls, d, i, cols);
        const item = (breakdownCache[`${d}_${i}`] || [])[j];
        if(item){
          html += `<td class="${tdCls}"><div class="bd-size">${item.w}×${item.l} m.</div><div class="bd-count">${num(item.count,0)}</div></td>`;
        } else {
          html += `<td class="${tdCls}"></td>`;
        }
      }
    }
    html += `</tr>`;
  }

  // เทียบเท่ามาตรฐาน 2.5mm (1220×2440) — ให้พนักงานรู้ว่าต้องเดินได้กี่แผ่นถ้าคิดเป็นมาตรฐาน
  html += `<tr><th>≈ มาตรฐาน 2.5mm<br>(1220×2440)</th>`;
  for(let d=1; d<=nd; d++){
    const runs = planData[`${line}_${d}`] || [];
    const cols = dayRunsCount[d-1];
    for(let i=0; i<cols; i++){
      const run = runs[i];
      const tdCls = slotClasses(cls, d, i, cols);
      if(run && run.thickness){
        const bd = breakdownCache[`${d}_${i}`] || [];
        const STD_AREA_M2 = 1.22 * 2.44;
        let fullConv = 0;
        bd.forEach(item=>{
          const areaM2 = (Number(item.w)||0) * (Number(item.l)||0);
          fullConv += item.count * (areaM2/STD_AREA_M2) * (run.thickness/STD_THICKNESS);
        });
        html += `<td class="${tdCls}" style="font-weight:700;color:var(--sub);">${num(fullConv,0)}</td>`;
      } else {
        html += `<td class="${tdCls}">—</td>`;
      }
    }
  }
  html += `</tr>`;

  // P/hr เป้า (คำนวณอัตโนมัติ)
  html += `<tr><th>P/hr เป้า</th>`;
  for(let d=1; d<=nd; d++){
    const runs = planData[`${line}_${d}`] || [];
    const cols = dayRunsCount[d-1];
    for(let i=0; i<cols; i++){
      const run = runs[i];
      const tdCls = slotClasses(cls, d, i, cols);
      const stdphr = run ? calcRun(line, run).stdphr : null;
      const stdMissing = run && run.thickness && stdphr===0;
      const val = run ? num(stdphr, 1) : '—';
      html += `<td class="${tdCls}${stdMissing?' not-std':''}">${val}</td>`;
    }
  }
  html += `</tr>`;

  // ชม.ผลิต (แก้ไขได้)
  html += `<tr><th>ชม.ผลิต</th>`;
  for(let d=1; d<=nd; d++){
    const runs = planData[`${line}_${d}`] || [];
    const cols = dayRunsCount[d-1];
    for(let i=0; i<cols; i++){
      const run = runs[i];
      const tdCls = slotClasses(cls, d, i, cols);
      if(IS_ADMIN){
        const v = run && run.hours!==null && run.hours!==undefined ? run.hours : '';
        html += `<td class="${tdCls}"><input type="number" step="0.5" min="0" class="pv-input pv-hr" value="${v}"
          onchange="updateRun('${line}',${d},${i},'hours',this.value)"></td>`;
      } else {
        const v = run && (run.hours!==null && run.hours!==undefined && run.hours!=='') ? run.hours : '—';
        html += `<td class="${tdCls}">${v}</td>`;
      }
    }
  }
  html += `</tr>`;

  // หมายเหตุ (แก้ไขได้)
  html += `<tr><th>หมายเหตุ</th>`;
  for(let d=1; d<=nd; d++){
    const runs = planData[`${line}_${d}`] || [];
    const cols = dayRunsCount[d-1];
    for(let i=0; i<cols; i++){
      const run = runs[i];
      const tdCls = slotClasses(cls, d, i, cols);
      if(IS_ADMIN){
        const v = run && run.note ? run.note : '';
        html += `<td class="${tdCls}"><input type="text" class="pv-input pv-note" value="${v}"
          onchange="updateRun('${line}',${d},${i},'note',this.value)"></td>`;
      } else {
        html += `<td class="${tdCls}">${run && run.note ? run.note : ''}</td>`;
      }
    }
  }
  html += `</tr>`;
  return html;
}

        <div style="display:flex;gap:6px;align-items:center;">
          <input type="number" step="1" min="0" class="std-input" style="width:70px" ${IS_ADMIN?'':'disabled'} value="${yucaDailyMin}" onchange="updateWoodConst('yucaDailyMin',this.value)">
          –
          <input type="number" step="1" min="0" class="std-input" style="width:70px" ${IS_ADMIN?'':'disabled'} value="${yucaDailyMax}" onchange="updateWoodConst('yucaDailyMax',this.value)">

      <label style="display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--sub);">

        <div style="display:flex;gap:6px;align-items:center;">
          <input type="number" step="1" min="0" class="std-input" style="width:70px" ${IS_ADMIN?'':'disabled'} value="${fuelDailyMin}" onchange="updateWoodConst('fuelDailyMin',this.value)">

    </div>
    <div style="font-size:.78rem;color:var(--sub);margin-bottom:6px;">ขนาด Raw Board (ก่อนตัด) และ Density แยกราย Line</div>
    <div class="tablewrap"><table class="std-table"><thead><tr>
      <th>Line</th><th>กว้าง (ม.)</th><th>ยาว (ม.)</th><th>Density (kg/m³)</th>
    </tr></thead><tbody>`;

    html += `<tr>

      <td><input type="number" step="0.01" min="0" class="std-input" style="width:70px" ${IS_ADMIN?'':'disabled'} value="${spec.w}" onchange="updateRawBoard('${line}','w',this.value)"></td>
      <td><input type="number" step="0.01" min="0" class="std-input" style="width:70px" ${IS_ADMIN?'':'disabled'} value="${spec.l}" onchange="updateRawBoard('${line}','l',this.value)"></td>
      <td><input type="number" step="1" min="0" class="std-input" style="width:80px" ${IS_ADMIN?'':'disabled'} value="${spec.density}" onchange="updateRawBoard('${line}','density',this.value)"></td>
    </tr>`;
  });
  html += `</tbody></table></div>
  </div>`;
  return html;
}

function buildMonthSummarySection(){
  const ym = currentMonth;
  const nd = daysInMonth(ym);
  const lines = ['Line 1','Line 2','Line 3'];
  const STD_AREA_M2 = 1.22 * 2.44; // พื้นที่มาตรฐาน 1220x2440 mm. เป็น ตร.ม.

  let html0 = IS_ADMIN ? buildWoodConfigPanel() : '';

  let grandTotal = 0, grandStdEquiv = 0;
  const lineTotals = {};
  const lineStdEquiv = {};
  const lineActiveDays = {};
  const thicknessData = {}; // thickness -> {'Line 1':n,'Line 2':n,'Line 3':n, sizeConvert:n, fullConvert:n}

  lines.forEach(line=>{
    let total = 0, stdEquiv = 0, totalHours = 0;
    for(let d=1; d<=nd; d++){
      const runs = planData[`${line}_${d}`] || [];
      runs.forEach(r=>{
        const boards = calcRun(line, r).boards;
        total += boards;
        totalHours += Number(r.hours)||0;
        if(r.thickness){
          const tKey = r.thickness;
          if(!thicknessData[tKey]) thicknessData[tKey] = {'Line 1':0,'Line 2':0,'Line 3':0, sizeConvert:0, fullConvert:0};
          thicknessData[tKey][line] += boards;

          // แปลงเป็นค่ากลาง โดยใช้ขนาดจริงของแต่ละแผ่นที่ (breakdown)
          const breakdown = calcRunSizeBreakdown(line, r);
          breakdown.forEach(item=>{
            const areaM2 = (Number(item.w)||0) * (Number(item.l)||0);
            const sizeConv = item.count * (areaM2 / STD_AREA_M2); // แปลงขนาดอย่างเดียว (ยังเป็นความหนาจริง)
            const fullConv = sizeConv * (tKey / STD_THICKNESS);   // แปลงทั้งขนาดและความหนา
            thicknessData[tKey].sizeConvert += sizeConv;
            thicknessData[tKey].fullConvert += fullConv;
            stdEquiv += fullConv;
          });
        }
      });
    }
    lineTotals[line] = total;
    lineStdEquiv[line] = stdEquiv;
    lineActiveDays[line] = totalHours/24;
    grandTotal += total;
    grandStdEquiv += stdEquiv;
  });

  let html = html0 + `<div class="summary" style="margin-bottom:14px;">
    <div class="card"><div class="label">รวมเป้าทั้ง 3 Line</div><div class="value">${num(grandTotal,0)} <span>แผ่น</span></div><div style="font-size:.78rem;color:var(--sub);margin-top:4px;">≈ ${num(grandStdEquiv,0)} แผ่น (เทียบเท่ามาตรฐาน 2.5mm, 1220×2440)</div></div>
    ${lines.map(line=>{
      const colorVar = line==='Line 1' ? 'var(--line1)' : line==='Line 2' ? 'var(--line2)' : 'var(--line3)';
      return `<div class="card"><div class="label" style="font-weight:700;color:${colorVar};">${line}</div><div class="value" style="color:${colorVar};">${num(lineTotals[line],0)} <span style="color:var(--sub);">แผ่น · เดินเครื่อง ${num(lineActiveDays[line],1)}/${nd} วัน</span></div><div style="font-size:.78rem;color:var(--sub);margin-top:4px;">≈ ${num(lineStdEquiv[line],0)} แผ่น เทียบเท่ามาตรฐาน · เดินเครื่อง ${num(lineActiveDays[line],1)}/${nd} วัน</div></div>`;
    }).join('')}
  </div>`;

  const thicknesses = Object.keys(thicknessData).map(Number).sort((a,b)=>a-b);
  if(thicknesses.length){
    const grandSizeConvert = thicknesses.reduce((s,t)=>s+thicknessData[t].sizeConvert, 0);
    let sumL1=0, sumL2=0, sumL3=0, sumTotal=0, sumWeight=0, sumB=0, sumF=0, sumRej=0, sumSizeConvert=0, sumFullConvert=0, sumPct=0;
    const bValHead = (gradePct.b!==undefined && gradePct.b!==null) ? gradePct.b : '';
    const fValHead = (gradePct.f!==undefined && gradePct.f!==null) ? gradePct.f : '';
    const rejValHead = (gradePct.rej!==undefined && gradePct.rej!==null) ? gradePct.rej : '';

    html += `<div style="margin-bottom:14px;">
      <div style="font-weight:700;margin-bottom:8px;color:var(--sub);font-size:.85rem;">สรุปตามความหนา — สัดส่วนการผลิตและน้ำหนักความหนาเฉลี่ย (รวมทั้ง 3 Line)</div>
      <div class="tablewrap"><table class="std-table"><thead><tr>
        <th>ความหนา<br>(mm.)</th><th class="l1">L1</th><th class="l2">L2</th><th class="l3">L3</th><th>Sum</th>
        <th style="background:#3a2c1f;">%B<br><input type="number" step="0.1" class="std-input grade-input" style="width:52px;margin-top:4px;" value="${bValHead}" ${IS_ADMIN?'':'disabled'} onchange="updateGradePct('b',this.value)"></th>
        <th style="background:#3a2c1f;">%F<br><input type="number" step="0.1" class="std-input grade-input" style="width:52px;margin-top:4px;" value="${fValHead}" ${IS_ADMIN?'':'disabled'} onchange="updateGradePct('f',this.value)"></th>
        <th style="background:#3a2c1f;">%Rej<br><input type="number" step="0.1" class="std-input grade-input" style="width:52px;margin-top:4px;" value="${rejValHead}" ${IS_ADMIN?'':'disabled'} onchange="updateGradePct('rej',this.value)"></th>
        <th>แปลงขนาด<br>1220×2440</th><th>แปลงความหนา<br>2.5</th><th>% ผลิตที่<br>1220×2440</th><th>น้ำหนัก<br>ความหนา</th>
      </tr></thead><tbody>`;

    thicknesses.forEach(t=>{
      const row = thicknessData[t];
      const sum = row['Line 1'] + row['Line 2'] + row['Line 3'];
      const pct = grandSizeConvert > 0 ? (row.sizeConvert / grandSizeConvert * 100) : 0;
      const weight = t * (pct/100);
      sumL1 += row['Line 1']; sumL2 += row['Line 2']; sumL3 += row['Line 3']; sumTotal += sum; sumWeight += weight;
      sumSizeConvert += row.sizeConvert; sumFullConvert += row.fullConvert; sumPct += pct;

      const bBoards = (gradePct.b!=null) ? sum * (gradePct.b/100) : null;
      const fBoards = (gradePct.f!=null) ? sum * (gradePct.f/100) : null;
      const rejBoards = (gradePct.rej!=null) ? sum * (gradePct.rej/100) : null;
      if(bBoards!=null) sumB += bBoards;
      if(fBoards!=null) sumF += fBoards;
      if(rejBoards!=null) sumRej += rejBoards;

      html += `<tr>
        <td class="thk">${t}</td>
        <td>${num(row['Line 1'],0)}</td><td>${num(row['Line 2'],0)}</td><td>${num(row['Line 3'],0)}</td>
        <td style="font-weight:700;">${num(sum,0)}</td>
        <td style="background:rgba(58,44,31,0.4);">${bBoards!=null ? num(bBoards,0) : '—'}</td>
        <td style="background:rgba(58,44,31,0.4);">${fBoards!=null ? num(fBoards,0) : '—'}</td>
        <td style="background:rgba(58,44,31,0.4);">${rejBoards!=null ? num(rejBoards,0) : '—'}</td>
        <td>${num(row.sizeConvert,0)}</td>
        <td>${num(row.fullConvert,0)}</td>
        <td>${num(pct,1)}%</td>
        <td>${num(weight,2)}</td>
      </tr>`;
    });

    html += `<tr style="font-weight:800;border-top:2px solid var(--grid);">
      <td class="thk">รวม</td>
      <td>${num(sumL1,0)}</td><td>${num(sumL2,0)}</td><td>${num(sumL3,0)}</td>
      <td>${num(sumTotal,0)}</td>
      <td>${gradePct.b!=null ? num(sumB,0) : ''}</td>
      <td>${gradePct.f!=null ? num(sumF,0) : ''}</td>
      <td>${gradePct.rej!=null ? num(sumRej,0) : ''}</td>
      <td>${num(sumSizeConvert,0)}</td><td>${num(sumFullConvert,0)}</td><td>${num(sumPct,1)}%</td>
      <td style="background:rgba(95,191,122,0.18);border:2px solid var(--ok);color:var(--ok);">${num(sumWeight,2)} mm.</td>
    </tr>`;

    html += `</tbody></table></div>
    </div>`;

    // สรุปโซนบาง (1.6-3.0mm) กับโซนหนา (3.2mm ขึ้นไป)
    let thinSum=0, thickSum=0, thinPct=0, thickPct=0;
    thicknesses.forEach(t=>{
      const row = thicknessData[t];
      const sum = row['Line 1'] + row['Line 2'] + row['Line 3'];
      const pct = grandSizeConvert > 0 ? (row.sizeConvert / grandSizeConvert * 100) : 0;
      if(t <= 3.0){ thinSum += sum; thinPct += pct; }
      else { thickSum += sum; thickPct += pct; }
    });

    html += `<div style="margin-bottom:14px;">
      <div style="font-weight:700;margin-bottom:8px;color:var(--sub);font-size:.85rem;">สรุปโซนความหนา — บาง (1.6–3.0mm) เทียบ หนา (3.2mm ขึ้นไป)</div>
      <div class="tablewrap"><table class="std-table"><thead><tr><th>โซน</th><th>ช่วงความหนา</th><th>รวมแผ่น (Sum)</th><th>% ของทั้งหมด</th></tr></thead><tbody>
        <tr><td class="thk">บาง</td><td>1.6 – 3.0 mm.</td><td style="font-weight:700;">${num(thinSum,0)}</td><td>${num(thinPct,1)}%</td></tr>
        <tr><td class="thk">หนา</td><td>3.2 mm. ขึ้นไป</td><td style="font-weight:700;">${num(thickSum,0)}</td><td>${num(thickPct,1)}%</td></tr>
      </tbody></table></div>
    </div>`;
  }

  // สรุปงบประมาณวัตถุดิบทั้งเดือน (เตรียมเงิน + ราคาเฉลี่ยต่อตัน)
  let yucaTotalTons = 0, yucaTotalBaht = 0, fuelTotalTons = 0, fuelTotalBaht = 0;
  for(let d=1; d<=nd; d++){
    const m = materialData[d] || {};
    const yr = Number(m.yucaReceived)||0;
    const fr = Number(m.fuelReceived)||0;
    yucaTotalTons += yr;
    yucaTotalBaht += yr * yucaPrice;
    fuelTotalTons += fr;
    fuelTotalBaht += fr * fuelPrice;
  }
  const yucaAvgPrice = yucaTotalTons > 0 ? yucaTotalBaht/yucaTotalTons : 0;
  const fuelAvgPrice = fuelTotalTons > 0 ? fuelTotalBaht/fuelTotalTons : 0;

  html += `<div style="margin-bottom:14px;">
    <div style="font-weight:700;margin-bottom:8px;color:var(--sub);font-size:.85rem;">งบประมาณวัตถุดิบทั้งเดือน (เตรียมเงินไว้ล่วงหน้า)</div>
    <div class="summary">
      <div class="card"><div class="label">เงินที่ต้องเตรียม — ยูคา</div><div class="value">${num(yucaTotalBaht,0)} <span>บาท</span></div><div style="font-size:.78rem;color:var(--sub);margin-top:4px;">รวม ${num(yucaTotalTons,1)} ตัน · เฉลี่ย ${num(yucaAvgPrice,0)} บาท/ตัน</div></div>
      <div class="card"><div class="label">เงินที่ต้องเตรียม — เชื้อเพลิง</div><div class="value">${num(fuelTotalBaht,0)} <span>บาท</span></div><div style="font-size:.78rem;color:var(--sub);margin-top:4px;">รวม ${num(fuelTotalTons,1)} ตัน · เฉลี่ย ${num(fuelAvgPrice,0)} บาท/ตัน</div></div>
      <div class="card"><div class="label">รวมงบวัตถุดิบทั้งเดือน</div><div class="value">${num(yucaTotalBaht+fuelTotalBaht,0)} <span>บาท</span></div></div>
    </div>
  </div>`;

  return html;
}

function buildPreviewAll(){
  const ym = currentMonth;
  const nd = daysInMonth(ym);
  const lines = ['Line 1','Line 2','Line 3'];

  // จำนวนช่องย่อยต่อวัน อ้างอิงจาก Line 1 เท่านั้น — Line 2,3 ใช้ผังวันเดียวกันเสมอ ต่อให้ยังไม่มีข้อมูล
  const dayRunsCount = [];
  for(let d=1; d<=nd; d++){
    const runs = planData[`Line 1_${d}`] || [];
    dayRunsCount.push(Math.max(runs.length, 1));
  }
  const totalCols = 1 + dayRunsCount.reduce((a,b)=>a+b,0);

  let html = buildMonthSummarySection();
  const todayStrPv = new Date().toISOString().slice(0,10);
  const todayDayPv = todayStrPv.slice(0,7)===ym ? Number(todayStrPv.slice(8,10)) : -1;
  html += `<div class="tablewrap"><table class="preview-table"><thead><tr class="dayheader"><th class="rowlabel-corner">Line / วันที่</th>`;
  for(let d=1; d<=nd; d++){
    const runs1 = planData[`Line 1_${d}`] || [];
    let ctl = '';
    if(IS_ADMIN){
      ctl = `<div class="day-ctl">
        <button class="pv-add-btn" onclick="addRun('Line 1',${d})" title="เพิ่มความหนา/รอบใหม่ในวันนี้ (Line 1)">+</button>
        ${runs1.length>0 ? `<button class="pv-rm-btn" onclick="previewRemoveLastRun('Line 1',${d})" title="ลบรอบสุดท้ายของวันนี้ (Line 1)">−</button>` : ''}
      </div>`;
    }
    const isTodayPv = d===todayDayPv;
    html += `<th colspan="${dayRunsCount[d-1]}" class="${d%2===0?'day-even':''} day-start day-end${isTodayPv?' today-col-header':''}">${d}${ctl}</th>`;
  }
  html += `</tr></thead><tbody>`;
  lines.forEach(line=>{ html += buildLineRows(line, dayRunsCount, totalCols, nd); });

  // แถวประมาณการใช้ไม้ยูคาลิปตัสประจำวัน (รวมทั้ง 3 Line ต่อวัน)
  html += `<tr class="line-sep" style="border-top-color:var(--sub);"><th colspan="${totalCols}">ประมาณการใช้ไม้ยูคาลิปตัส และไอน้ำประจำวัน</th></tr>`;

  // เก็บค่าต่อวันไว้ก่อน เพื่อใช้คำนวณแถวไอน้ำต่อ (ต้องใช้ทั้งสองสายเฉลี่ยกัน)
  const dayTonsStdArr = [], dayTonsTgtArr = [];
  for(let d=1; d<=nd; d++){
    let tonsStd = 0, tonsTgt = 0;
    const sizeConvertByThickness = {}; // thickness -> sizeConvert (น้ำหนักถ่วงสำหรับหายิวเฉลี่ยของวันนั้น)
    lines.forEach(line=>{
      const runs = planData[`${line}_${d}`] || [];
      runs.forEach(r=>{
        tonsStd += calcWoodTonsStandard(line, r);
        tonsTgt += calcWoodTonsTarget(line, r);
        if(r.thickness){
          const bd = calcRunSizeBreakdown(line, r);
          const STD_AREA_M2 = 1.22*2.44;
          let sc = 0;
          bd.forEach(item=>{
            const areaM2 = (Number(item.w)||0)*(Number(item.l)||0);
            sc += item.count * (areaM2/STD_AREA_M2);
          });
          sizeConvertByThickness[r.thickness] = (sizeConvertByThickness[r.thickness]||0) + sc;
        }
      });
    });
    dayTonsStdArr.push({tons:tonsStd, sizeMap:sizeConvertByThickness});
    dayTonsTgtArr.push(tonsTgt);
  }

  html += `<tr><th>ยูคา (จาก Density มาตรฐาน) ตัน</th>`;
  for(let d=1; d<=nd; d++){
    const cols = dayRunsCount[d-1];
    const v = dayTonsStdArr[d-1].tons;
    html += `<td colspan="${cols}" style="font-weight:700;">${v>0 ? num(v,2) : '—'}</td>`;
  }
  html += `</tr>`;

  html += `<tr><th>ยูคา Target (ควบคุม) ตัน</th>`;
  for(let d=1; d<=nd; d++){
    const cols = dayRunsCount[d-1];
    const v = dayTonsTgtArr[d-1];
    html += `<td colspan="${cols}" style="font-weight:700;color:var(--amber);">${v>0 ? num(v,2) : '—'}</td>`;
  }
  html += `</tr>`;

  html += `<tr><th>ประมาณการใช้ไอน้ำ (ตัน)</th>`;
  const steamTonsArr = [];
  for(let d=1; d<=nd; d++){
    const cols = dayRunsCount[d-1];
    const tonsStd = dayTonsStdArr[d-1].tons;
    const tonsTgt = dayTonsTgtArr[d-1];
    const sizeMap = dayTonsStdArr[d-1].sizeMap;
    const avgWoodTons = (tonsStd + tonsTgt) / 2;

    // หายิวเฉลี่ยถ่วงน้ำหนักตามสัดส่วนการผลิตแต่ละความหนาของวันนั้น
    const thicknesses = Object.keys(sizeMap);
    let totalSc = 0, weightedYieldSum = 0;
    thicknesses.forEach(t=>{
      const sc = sizeMap[t];
      totalSc += sc;
      weightedYieldSum += sc * getYieldRatio(Number(t));
    });
    const avgYield = totalSc > 0 ? weightedYieldSum/totalSc : 0;
    const hardBoardTons = avgYield > 0 ? avgWoodTons / avgYield : 0;
    const steamTons = hardBoardTons * steamRatePerTonFG;
    steamTonsArr.push(steamTons);

    html += `<td colspan="${cols}" style="font-weight:700;color:var(--ok);">${steamTons>0 ? num(steamTons,2) : '—'}</td>`;
  }
  html += `</tr>`;

  // แผนการใช้วัตถุดิบและสต๊อก (ยูคา + เชื้อเพลิง)
  html += `<tr class="line-sep" style="border-top-color:var(--sub);"><th colspan="${totalCols}">แผนการใช้วัตถุดิบและสต๊อก</th></tr>`;

  html += `<tr><th>ยูคา — เบิกใช้ (ตัน)</th>`;
  const yucaUsedArr = [];
  for(let d=1; d<=nd; d++){
    const cols = dayRunsCount[d-1];
    const used = (dayTonsStdArr[d-1].tons + dayTonsTgtArr[d-1]) / 2;
    yucaUsedArr.push(used);
    html += `<td colspan="${cols}">${used>0 ? num(used,2) : '—'}</td>`;
  }
  html += `</tr>`;

  html += `<tr><th>ยูคา — เป้ารับเข้า (ตัน)</th>`;
  for(let d=1; d<=nd; d++){
    const cols = dayRunsCount[d-1];
    const m = materialData[d] || {};
    const v = (m.yucaReceived!=null && m.yucaReceived!=='') ? m.yucaReceived : '';
    html += `<td colspan="${cols}">${IS_ADMIN
      ? `<input type="number" step="0.01" min="0" class="pv-input" style="width:70px" value="${v}" onchange="updateMaterial(${d},'yucaReceived',this.value)">`
      : (v!==''?num(v,2):'—')}</td>`;
  }
  html += `</tr>`;

  html += `<tr><th>ยูคา — สต๊อกคงเหลือ (ตัน)</th>`;
  let yucaStock = safeNum(yucaStockTarget);
  for(let d=1; d<=nd; d++){
    const cols = dayRunsCount[d-1];
    const m = materialData[d] || {};
    const received = safeNum(m.yucaReceived);
    const computedStock = yucaStock + received - safeNum(yucaUsedArr[d-1]);
    const override = (m.yucaStockOverride!=null && m.yucaStockOverride!=='') ? safeNum(m.yucaStockOverride) : null;
    const displayStock = safeNum(override!=null ? override : computedStock);
    yucaStock = displayStock; // ใช้เป็นฐานคำนวณของวันถัดไป (คาลิเบทได้ถ้านับจริงไม่ตรง)

      html += `<td colspan="${cols}" style="font-weight:700;${override!=null?'color:var(--danger);':''}">${num(displayStock,1)}${lastDayNote}</td>`;

  html += `</tr>`;

  html += `<tr><th>ยูคา — บาท</th>`;
  for(let d=1; d<=nd; d++){
    const cols = dayRunsCount[d-1];
    const m = materialData[d] || {};
    const received = Number(m.yucaReceived)||0;

  html += `<tr><th>เชื้อเพลิง — เบิกใช้ (ตัน)</th>`;

  html += `<tr><th>เชื้อเพลิง — เป้ารับเข้า (ตัน)</th>`;

    html += `<td colspan="${cols}">${IS_ADMIN

    if(IS_ADMIN){
      html += `<td colspan="${cols}"><input type="number" step="0.01" class="pv-input${override!=null?' stock-override':''}" style="width:75px;font-weight:700;${isLastDay?'border-color:var(--ok);':''}" value="${numPlain(displayStock,2)}" onchange="updateMaterial(${d},'fuelStockOverride',this.value)" title="คำนวณได้ ${num(computedStock,2)} ตัน — แก้เป็นค่านับจริงได้ถ้าไม่ตรง (จะขึ้นสีแดงถ้าปรับเอง)">${lastDayNote}</td>`;

      html += `<td colspan="${cols}" style="font-weight:700;${override!=null?'color:var(--danger);':''}">${num(displayStock,1)}${lastDayNote}</td>`;

  html += `<tr><th>เชื้อเพลิง — บาท</th>`;

  return html;
}

function buildProductionLineTable(line){
  const ym = currentMonth;
  const nd = daysInMonth(ym);

  const dayRunsCount = [];
  for(let d=1; d<=nd; d++){
    const runs = planData[`Line 1_${d}`] || [];
    dayRunsCount.push(Math.max(runs.length, 1));
  }
  const totalCols = 1 + dayRunsCount.reduce((a,b)=>a+b,0);

  let totalTarget=0, totalHours=0, thicknessSet=new Set();
  for(let d=1; d<=nd; d++){
    const runs = planData[`${line}_${d}`] || [];
    runs.forEach(r=>{
      totalTarget += calcRun(line, r).boards;
      totalHours += Number(r.hours)||0;
      if(r.thickness) thicknessSet.add(r.thickness);
    });
  }
  const activeDaysEquiv = totalHours/24;

  let html = `<div class="summary">
    <div class="card"><div class="label">รวมเป้าเดือนนี้</div><div class="value">${num(totalTarget,0)} <span>แผ่น</span></div></div>
    <div class="card"><div class="label">วันเดินเครื่อง</div><div class="value">${num(activeDaysEquiv,1)} <span>/ ${nd} วัน</span></div></div>
    <div class="card"><div class="label">ความหนาที่ใช้เดือนนี้</div><div class="value" style="font-size:1rem;">${[...thicknessSet].sort((a,b)=>a-b).join(', ')||'—'} <span>mm.</span></div></div>
  </div>`;
  html += `<div class="scrollhint">⇄ เลื่อนซ้าย-ขวาเพื่อดูวันที่ 1-${nd}</div>`;
  html += `<div class="tablewrap"><table class="preview-table"><thead><tr class="dayheader"><th class="rowlabel-corner">วันที่</th>`;
  const todayStrSt = new Date().toISOString().slice(0,10);
  const todayDaySt = todayStrSt.slice(0,7)===ym ? Number(todayStrSt.slice(8,10)) : -1;
  for(let d=1; d<=nd; d++){
    const isTodaySt = d===todayDaySt;
    html += `<th colspan="${dayRunsCount[d-1]}" class="${d%2===0?'day-even':''} day-start day-end${isTodaySt?' today-col-header':''}">${d}</th>`;
  }
  html += `</tr></thead><tbody>`;
  html += buildLineRows(line, dayRunsCount, totalCols, nd).replace(/<tr class="line-sep[^>]*>.*?<\/tr>/, '');
  html += `</tbody></table></div>`;
  return html;
}

function calcSizeRowArea(row){
  if(!row || !Array.isArray(row.sheets)) return 0;
  return row.sheets.reduce((sum, s)=>{
    const w = Number(s && s.w) || 0;
    const l = Number(s && s.l) || 0;
    return sum + (w * l);
  }, 0);
}

function findNormalRowArea(){
  for(const rid of Object.keys(sizeStdRows)){
    const row = sizeStdRows[rid];
    if(row && row.name && row.name.trim().toLowerCase() === 'normal'){
      return calcSizeRowArea(row);
    }
  }
  return 0;
}

      runs.forEach(r=> dayTotal += calcRun(line, r).boards);
      const effDay = dayTotal * pct;
      monthTotal += effDay;
      html += `<td class="${cls}">${effDay>0 ? num(effDay,0) : '—'}</td>`;
    }
    html += `<td class="${cls}" style="font-weight:800;">${num(monthTotal,0)}</td>`;
    html += `</tr>`;
  });
  html += `</tbody></table></div>`;
  mainEl.innerHTML = html;

  const effMonthPicker = document.getElementById('effMonthPicker');
  if(effMonthPicker){
    effMonthPicker.addEventListener('change', (e)=>{
      currentMonth = e.target.value;
      document.getElementById('monthPicker').value = currentMonth;
      loadMonth(currentMonth);
    });
  }
}

function buildPurchaseMaterialView(){
  const ym = currentMonth;
  const nd = daysInMonth(ym);
  const lines = ['Line 1','Line 2','Line 3'];

  // คำนวณเป้า (KPI) การใช้วัตถุดิบต่อวัน โดยใช้สูตรเดียวกับตารางวัตถุดิบหลัก
  const yucaTargetUsed = [], fuelTargetUsed = [];
  for(let d=1; d<=nd; d++){
    let tonsStd = 0, tonsTgt = 0;
    const sizeMap = {};
    lines.forEach(line=>{
      const runs = planData[`${line}_${d}`] || [];
      runs.forEach(r=>{
        tonsStd += calcWoodTonsStandard(line, r);
        tonsTgt += calcWoodTonsTarget(line, r);
        if(r.thickness){
          const bd = calcRunSizeBreakdown(line, r);
          const STD_AREA_M2 = 1.22*2.44;
          let sc = 0;
          bd.forEach(item=>{
            const areaM2 = (Number(item.w)||0)*(Number(item.l)||0);
            sc += item.count*(areaM2/STD_AREA_M2);
          });
          sizeMap[r.thickness] = (sizeMap[r.thickness]||0) + sc;
        }
      });
    });
    const yucaUsed = (tonsStd + tonsTgt) / 2;
    yucaTargetUsed.push(yucaUsed);

    const thicknesses = Object.keys(sizeMap);
    let totalSc = 0, weightedYieldSum = 0;
    thicknesses.forEach(t=>{
      const sc = sizeMap[t];
      totalSc += sc;
      weightedYieldSum += sc * getYieldRatio(Number(t));
    });
    const avgYield = totalSc > 0 ? weightedYieldSum/totalSc : 0;
    const hardBoardTons = avgYield > 0 ? yucaUsed/avgYield : 0;
    const steamTons = hardBoardTons * steamRatePerTonFG;
    fuelTargetUsed.push(steamTons * fuelRatePerTonSteam);
  }

  // สต๊อกคงเหลือจริง (ตามที่จัดซื้อกรอกเอง: ใช้จริง + รับเข้าจริง, ปรับ/คาลิเบทได้รายวัน)
  const yucaActualStockArr = [], fuelActualStockArr = [];
  let yucaStockRun = safeNum(yucaStockTarget), fuelStockRun = safeNum(fuelStockTarget);
  for(let d=1; d<=nd; d++){
    const p = procurementActual[d] || {};
    const yucaUsedActual = (p.yucaActualUsed!=null && p.yucaActualUsed!=='') ? safeNum(p.yucaActualUsed) : safeNum(yucaTargetUsed[d-1]);
    const fuelUsedActual = (p.fuelActualUsed!=null && p.fuelActualUsed!=='') ? safeNum(p.fuelActualUsed) : safeNum(fuelTargetUsed[d-1]);
    const yucaComputed = yucaStockRun + safeNum(p.yucaActualReceived) - yucaUsedActual;
    const fuelComputed = fuelStockRun + safeNum(p.fuelActualReceived) - fuelUsedActual;
    const yucaOverride = (p.yucaActualStockOverride!=null && p.yucaActualStockOverride!=='') ? safeNum(p.yucaActualStockOverride) : null;
    const fuelOverride = (p.fuelActualStockOverride!=null && p.fuelActualStockOverride!=='') ? safeNum(p.fuelActualStockOverride) : null;
    const yucaDisplay = safeNum(yucaOverride!=null ? yucaOverride : yucaComputed);
    const fuelDisplay = safeNum(fuelOverride!=null ? fuelOverride : fuelComputed);
    yucaActualStockArr.push({display:yucaDisplay, computed:yucaComputed, override:yucaOverride, usedActual:yucaUsedActual});
    fuelActualStockArr.push({display:fuelDisplay, computed:fuelComputed, override:fuelOverride, usedActual:fuelUsedActual});
    yucaStockRun = yucaDisplay;
    fuelStockRun = fuelDisplay;
  }

  const todayStr = new Date().toISOString().slice(0,10);
  const todayDayNum = todayStr.slice(0,7)===ym ? Number(todayStr.slice(8,10)) : nd;

  let html = `<div style="color:var(--sub);font-size:.85rem;margin-bottom:14px;">
    หน้าจัดซื้อวัตถุดิบ — เทียบเป้า (KPI จากแผนผลิต) กับผลจัดซื้อจริงประจำวัน · เดือน ${ym}

  // ===== แผงคำนวณช่วยจัดซื้อ (ปรับแผนให้ทันเป้าปลายเดือน) =====

      : `<div style="font-size:.76rem;color:var(--sub);margin-top:8px;">ยังไม่มีการปรับแผนแก้เกมในเดือนนี้</div>`;
    html += `<div class="previewbox" style="margin-bottom:14px;">
      <div class="previewhead"><b>คำนวณช่วยจัดซื้อ — ปรับแผนวันที่เหลือให้ทันเป้าปลายเดือน${IS_ADMIN?' (ประวัติ — ดูอย่างเดียว)':''}</b></div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;">
        <label style="display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--sub);">
          นับสต๊อกจริง ณ วันที่

      ${historyNote}
    </div>`;
  }

  // ===== แผนรับเข้าประจำวัน แยกรายลูกค้า/ซัพพลายเออร์ =====
  if((IS_PURCHASE || IS_ADMIN) && typeof HISTORICAL_IMPORT_2607 !== 'undefined' && ym==='2026-07'){
    html += `<div class="previewbox" style="margin-bottom:14px;">

      ${(IS_PURCHASE||IS_ADMIN) ? `<button class="btn primary" onclick="importHistoricalData()">นำเข้าข้อมูลตอนนี้</button>` : ''}
    </div>`;
  }
  if((IS_PURCHASE || IS_ADMIN) && typeof HISTORICAL_COST_IMPORT_2607 !== 'undefined' && ym==='2026-07'){
    html += `<div class="previewbox" style="margin-bottom:14px;">
      <div class="previewhead"><b>นำเข้าต้นทุนประจำวันจากไฟล์บัญชี (ก.ค. 69 วันที่ 1-24)</b></div>
      <div style="font-size:.78rem;color:var(--sub);margin-bottom:10px;">มีทั้งตันและราคาต่อตันจริงจากบัญชี — จะเติม/เขียนทับ "รับเข้าจริง" และ "ราคาจริง" ของทั้งยูคาและเชื้อเพลิง วันที่ 1-24</div>
      ${(IS_PURCHASE||IS_ADMIN) ? `<button class="btn primary" onclick="importCostData()">นำเข้าต้นทุนตอนนี้</button>` : ''}

    <div style="font-size:.78rem;color:var(--sub);margin-bottom:10px;">อัปโหลดไฟล์รายงานการรับไม้ประจำเดือนจากบัญชี (รูปแบบเดียวกับที่เคยส่ง) ระบบจะอ่านแถว "ไม้ท่อนยูคา" และ "ไม้ท่อนเชื้อเพลิง" ของแต่ละวันที่ในไฟล์ แล้วเติมรับเข้าจริง+ราคาจริงให้เองอัตโนมัติ (เขียนทับวันที่ตรงกันในไฟล์)</div>
    ${(IS_PURCHASE||IS_ADMIN) ? `<input type="file" id="costFileInput" accept=".xlsx,.xls" onchange="handleCostFileUpload(this)">` : ''}

  html += `<tr><th>การใช้จริง (ตัน)</th>`;

  let sumYucaActual=0, sumFuelActual=0, sumYucaActualBaht=0, sumFuelActualBaht=0;

  </div>`;

  html += `<div style="font-weight:700;margin:18px 0 8px;">สต๊อกปลายเดือน (ประเมินจากผลจัดซื้อจริงถึงตอนนี้) เทียบเป้า</div>`;
  html += `<div class="summary">
    <div class="card"><div class="label">ยูคา — สต๊อกปลายเดือน (ประเมิน)</div><div class="value" style="color:${yucaStockOk?'var(--ok)':'var(--danger)'};">${num(yucaStockActual,0)} <span>ตัน</span></div><div style="font-size:.78rem;color:var(--sub);margin-top:4px;">เป้า ${num(yucaEndStockTarget,0)} ตัน · รับเข้าจริงสะสม ${num(sumYucaActual,0)} ตัน</div></div>
    <div class="card"><div class="label">เชื้อเพลิง — สต๊อกปลายเดือน (ประเมิน)</div><div class="value" style="color:${fuelStockOk?'var(--ok)':'var(--danger)'};">${num(fuelStockActual,0)} <span>ตัน</span></div><div style="font-size:.78rem;color:var(--sub);margin-top:4px;">เป้า ${num(fuelEndStockTarget,0)} ตัน · รับเข้าจริงสะสม ${num(sumFuelActual,0)} ตัน</div></div>

  </div>`;

  return html;
}

window.updateRun = function(line, day, idx, field, value){
  const key = `${line}_${day}`;
  if(!planData[key]) planData[key] = [];
  if(!planData[key][idx]) planData[key][idx] = {};
  if(field==='thickness') value = value ? Number(value) : '';
  if(field==='hours') value = value ? Number(value) : '';

  if(field==='hours'){
    const runs = planData[key];
    let total = 0;
    runs.forEach((r,i)=>{ total += (i===idx ? (Number(value)||0) : (Number(r && r.hours)||0)); });
    if(total > 24){
      alert(`ชม.ผลิตรวมของ ${line} วันที่ ${day} เกิน 24 ชม. ไม่ได้ (ตอนนี้รวมจะเป็น ${total} ชม.) — รวมทุกความหนาในวันนั้นต้องไม่เกิน 24 ชม.`);
      renderAll(); // รีเซ็ตช่องกรอกกลับเป็นค่าเดิม ไม่บันทึกค่าที่เกิน
      return;
    }
  }

  planData[key][idx][field] = value;
  renderAll();
  markDirtyDay(line, day);
};
window.addRun = function(line, day){

};

window.autoFillReceiveTargets = async function(){
  if(!IS_ADMIN) return;
  const ym = currentMonth;
  const nd = daysInMonth(ym);
  const lines = ['Line 1','Line 2','Line 3'];

  // คำนวณเบิกใช้รวมทั้งเดือน (ยูคา + เชื้อเพลิง) ด้วยสูตรเดียวกับที่ตารางใช้อยู่จริง
  let totalYucaUsed = 0, totalFuelUsed = 0;
  for(let d=1; d<=nd; d++){
    let tonsStd = 0, tonsTgt = 0;
    const sizeMap = {};
    lines.forEach(line=>{
      const runs = planData[`${line}_${d}`] || [];
      runs.forEach(r=>{
        tonsStd += calcWoodTonsStandard(line, r);
        tonsTgt += calcWoodTonsTarget(line, r);
        if(r.thickness){
          const bd = calcRunSizeBreakdown(line, r);
          const STD_AREA_M2 = 1.22*2.44;
          let sc = 0;
          bd.forEach(item=>{
            const areaM2 = (Number(item.w)||0)*(Number(item.l)||0);
            sc += item.count*(areaM2/STD_AREA_M2);
          });
          sizeMap[r.thickness] = (sizeMap[r.thickness]||0) + sc;
        }
      });
    });
    const yucaUsed = (tonsStd + tonsTgt) / 2;
    totalYucaUsed += yucaUsed;

    const thicknesses = Object.keys(sizeMap);
    let totalSc = 0, weightedYieldSum = 0;
    thicknesses.forEach(t=>{
      const sc = sizeMap[t];
      totalSc += sc;
      weightedYieldSum += sc * getYieldRatio(Number(t));
    });
    const avgYield = totalSc > 0 ? weightedYieldSum/totalSc : 0;
    const hardBoardTons = avgYield > 0 ? yucaUsed/avgYield : 0;
    const steamTons = hardBoardTons * steamRatePerTonFG;
    totalFuelUsed += steamTons * fuelRatePerTonSteam;
  }

  const requiredYuca = yucaEndStockTarget - yucaStockTarget + totalYucaUsed;
  const requiredFuel = fuelEndStockTarget - fuelStockTarget + totalFuelUsed;
  const dailyYucaRaw = requiredYuca/nd;
  const dailyFuelRaw = requiredFuel/nd;
  const dailyYuca = Math.round(Math.min(yucaDailyMax, Math.max(yucaDailyMin, dailyYucaRaw)) * 100) / 100;
  const dailyFuel = Math.round(Math.min(fuelDailyMax, Math.max(fuelDailyMin, dailyFuelRaw)) * 100) / 100;

  const actualYucaEnd = yucaStockTarget + (dailyYuca*nd) - totalYucaUsed;
  const actualFuelEnd = fuelStockTarget + (dailyFuel*nd) - totalFuelUsed;
  const yucaClamped = Math.abs(dailyYuca-dailyYucaRaw) > 0.01;
  const fuelClamped = Math.abs(dailyFuel-dailyFuelRaw) > 0.01;

  let msg = `จะเติมเป้ารับเข้าเท่าๆ กันทุกวัน (${nd} วัน):\n`;
  msg += `ยูคาวันละ ${dailyYuca} ตัน (จำกัดในช่วง ${yucaDailyMin}-${yucaDailyMax})${yucaClamped?` — เกินความสามารถรับจริง สต๊อกปลายเดือนจะได้ประมาณ ${actualYucaEnd.toFixed(0)} ตัน แทนที่จะเป็น ${yucaEndStockTarget} ตันตามเป้า`:` — ได้ตามเป้า ${yucaEndStockTarget} ตัน`}\n`;
  msg += `เชื้อเพลิงวันละ ${dailyFuel} ตัน (จำกัดในช่วง ${fuelDailyMin}-${fuelDailyMax})${fuelClamped?` — เกินความสามารถรับจริง สต๊อกปลายเดือนจะได้ประมาณ ${actualFuelEnd.toFixed(0)} ตัน แทนที่จะเป็น ${fuelEndStockTarget} ตันตามเป้า`:` — ได้ตามเป้า ${fuelEndStockTarget} ตัน`}\n`;
  msg += `\nจะเขียนทับเป้ารับเข้าที่มีอยู่เดิมทั้งเดือน ดำเนินการต่อไหม?`;

  if(!confirm(msg)) return;

  for(let d=1; d<=nd; d++){
    if(!materialData[d]) materialData[d] = {};
    materialData[d].yucaReceived = dailyYuca;
    materialData[d].fuelReceived = dailyFuel;
    markDirtyMaterial(d);
  }
  renderAll();
};

window.importCostData = function(){
  if(!IS_PURCHASE && !IS_ADMIN) return;
  if(typeof HISTORICAL_COST_IMPORT_2607 === 'undefined'){ alert('ไม่พบข้อมูลต้นทุนนำเข้า'); return; }
  if(!confirm('จะนำเข้าต้นทุนประจำวัน (ยูคา+เชื้อเพลิง+ไม้/เชื้อเพลิงประเภทอื่น) วันที่ 1-24 ก.ค. 69 จากไฟล์บัญชี เขียนทับ "รับเข้าจริง" และ "ราคาจริง" ของวันที่เหล่านี้ทั้งหมด ดำเนินการต่อไหม?')) return;
  applyCostDataToDays(HISTORICAL_COST_IMPORT_2607);

      otherMaterialActual[day] = HISTORICAL_OTHERMAT_2607[dayStr];
      markDirtyOtherMat(day);
